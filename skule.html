<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nye bøker – skulen</title>
<!--
  Liggjande infoskjerm for skulen. Viser éi bok om gongen og vekslar
  mellom to karusellar: mellomtrinnet og ungdomstrinnet.

  Karusellane er dei vanlege frå index.html, bygde på malen «Nyheiter»
  med aldersgrupper og berre bøker som står på hylla. Denne sida legg
  på ei liggjande utforming (omslaget til venstre, teksten til høgre),
  så index.html sjølv er uendra.

  Valfritt i adressa:
    ?bytt=3            byt karusell etter 3 bøker (standard: kvar bok)
    &tema=skog         tema for begge (mtema= og utema= for kvar for seg)
    &m=<lenkje>        eigne innstillingar for mellomtrinnet (lenkja frå byggjaren)
    &u=<lenkje>        eigne innstillingar for ungdomstrinnet
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4efe6; cursor: none; }   /* bakgrunnen til «Lys», synleg før første bok er klar */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity 1s ease; background: #f4efe6; }
  /* Den nye ramma tonar inn oppå den gamle, som står heilt synleg under til overgangen er ferdig.
     Då skin ikkje bakgrunnen til sida gjennom midt i overgangen. */
  iframe.synleg { opacity: 1; z-index: 2; }
  iframe.ut { opacity: 1; z-index: 1; transition: none; }
</style>
</head>
<body>
<iframe id="mellom" title="Nye bøker for mellomtrinnet"></iframe>
<iframe id="ungdom" title="Nye bøker for ungdomstrinnet"></iframe>
<script>
// ---- Innstillingane til karusellane ------------------------------------
// Malen «Nyheiter» frå byggjaren, avgrensa til aldersgruppe og bøker som
// står på hylla. aldermodus «yngst»: berre den yngste aldersgruppa til boka
// tel, så ei bok høyrer til éin karusell (6–16 år blir mellomtrinnet,
// 13–16 år ungdomstrinnet, og 3–16 år blir ikkje med). Berre bøker på bokmål
// og nynorsk (spraak). «Nyaste» hentar dei nyaste bøkene og sorterer bort resten
// etterpå, så vi hentar fleire enn vi treng.
const NYHEITER = { kjelde: "nyaste", lf: "", sjanger: "", plass: "", emne: "", emnemodus: "eitt", ccl: "", rekkje: "tilfeldig",
                   omslag: "1", hylla: "1", perforf: "0", utan: "magasin, nærmag", antal: "100", aarfra: "", aartil: "", alle: "0",
                   tema: "lys", bakgrunn: "flat", omtalelengd: "380", sek: "18", oppdater: "360", omtale: "1" };
const STANDARD = {
  m: { ...NYHEITER, avd: "tyfb",      alder: "b,bu,u", aldermodus: "yngst", spraak: "nob,nno", namn: "5.–7. trinn",  tittel: "Nytt for mellomtrinnet" },
  // Ungdom: «Nyaste» åleine gav for få treff. «begge» tek dei nyaste bøkene på
  // biblioteket og i tillegg bøker gjevne ut i år (aarsiste 1). Bøker for 13–16 år,
  // gjerne òg unge vaksne, men ikkje berre unge vaksne.
  u: { ...NYHEITER, kjelde: "begge", aarsiste: "1", antal: "60",
       avd: "tyfb,tyfv", alder: "mu", aldermodus: "yngst", spraak: "nob,nno", namn: "8.–10. trinn", tittel: "Nytt for ungdomstrinnet" },
};

const adresse = new URLSearchParams(location.search);
const BYTT = Math.max(1, Number(adresse.get("bytt")) || 1);   // tal bøker før vi byter karusell

function lenkje(kva) {
  const eigne = adresse.get(kva);
  const p = new URLSearchParams(eigne ? eigne.replace(/^.*#/, "") : STANDARD[kva]);
  // ?tema=skog gjeld begge, ?mtema=… og ?utema=… kvar for seg
  const tema = adresse.get(kva + "tema") || adresse.get("tema");
  if (tema) p.set("tema", tema);
  p.set("vis", "1");
  return "index.html#" + p.toString();
}

// ---- Liggjande utforming --------------------------------------------------
// Karusellen er laga for ståande skjerm og reknar storleikar i vw (breidda).
// Her legg vi omslaget til venstre og teksten til høgre, og reknar ut frå høgda.
const LIGGJANDE = `
  #visning main { padding: 6vh 6vw 4vh !important; }
  #visning header { gap: .8vh; }
  .overskrift { font-size: calc(8vh * var(--skala-overskrift, 1)) !important; }
  .avdeling { font-size: 3.4vh !important; }
  .scene { margin-top: 4vh !important; }
  .bok { flex-direction: row !important; align-items: center !important; gap: 5vw; }
  .omslag-ramme { flex: 0 0 38% !important; width: auto !important; height: 100% !important; max-height: 100% !important; justify-content: flex-end !important; }
  .omslag { max-height: 100% !important; max-width: 100% !important; border-radius: 1vh !important; }
  .reserve { padding: 4vh !important; font-size: 4.2vh !important; border-left-width: 1.2vh !important; border-radius: 1vh !important; }
  .info { flex: 1 1 0 !important; min-width: 0; max-height: 100%; overflow: hidden; margin-top: 0 !important; text-align: left !important; }
  .tittel { font-size: calc(6.6vh * var(--skala-tittel, 1)) !important; }
  .undertittel { font-size: 3.6vh !important; }
  .forfattar { font-size: 4.2vh !important; margin-top: 2vh !important; }
  .brikker { justify-content: flex-start !important; gap: 1.4vh !important; margin-top: 3.4vh !important; }
  .brikke { font-size: 2.7vh !important; padding: .9vh 2.3vh !important; }
  .omtale { font-size: 3.1vh !important; line-height: 1.5 !important; max-width: 62vw !important; margin: 3vh 0 0 !important; -webkit-line-clamp: 6 !important; }
  .botnnamn { font-size: 3.2vh !important; }
  .kjeldetekst { font-size: 1.8vh !important; }
  .melding { font-size: 4.4vh !important; padding: 10vh !important; }
  .melding .liten { font-size: 3vh !important; }
  .snurr { width: 8vh !important; height: 8vh !important; border-width: .8vh !important; }
`;

const rammer = [
  { el: document.getElementById("mellom"), url: lenkje("m"), klar: false, har: false },
  { el: document.getElementById("ungdom"), url: lenkje("u"), klar: false, har: false },
];
for (const r of rammer) {
  r.sek = Number(new URLSearchParams(r.url.split("#")[1]).get("sek")) || 20;   // sekund per bok
  r.el.addEventListener("load", () => {
    try {
      const s = r.el.contentDocument.createElement("style");
      s.textContent = LIGGJANDE;
      r.el.contentDocument.head.append(s);
    } catch (e) {}
  });
  r.el.src = r.url;
}

// ---- Veksling --------------------------------------------------------------
// Karusellane ventar på beskjed («vis»/«skjul»), same ordning som rotasjonssida.
// Vi ser etter når den synlege karusellen byrjar på ei ny bok. Når han har vist
// BYTT bøker, set vi han på pause og viser den andre. Ved pause hugsar karusellen
// boka han nett byrja på, og viser henne først neste gong.
let aktiv = -1, viste = 0, sistBok = null, byttTid = null;
const send = (r, kva, meir) => { try { r.el.contentWindow.postMessage({ nyheiter: kva, ...meir }, "*"); } catch (e) {} };

// Har karusellen ei lagra boklista frå før, startar han med henne utan å seie frå.
function harLagra(r) {
  try {
    const w = r.el.contentWindow;
    const l = JSON.parse(w.localStorage.getItem("karusell3:" + w.datanøkkel(w.lesAdresse().cfg)) || "null");
    return !!(l && l.titlar && l.titlar.length);
  } catch (e) { return false; }
}

// Ein karusell blir berre vist når han har bøker klare. Medan han hentar
// første gong, står han gøymd, så ingen ser meldingar om henting og filtrering.
function vis(n) {
  clearTimeout(byttTid);
  // «vidare»: den gamle karusellen hoppar over boka han viste, så ho ikkje kjem att neste gong
  if (aktiv >= 0 && aktiv !== n) {
    const gamal = rammer[aktiv].el;
    send(rammer[aktiv], "skjul", { vidare: true });
    gamal.classList.add("ut"); gamal.classList.remove("synleg");
    setTimeout(() => gamal.classList.remove("ut"), 1100);
  }
  aktiv = n; viste = 0; sistBok = null;
  rammer[n].el.classList.add("synleg");
  send(rammer[n], "vis");
}
function neste() {
  for (let steg = 1; steg <= rammer.length; steg++) {
    const n = (aktiv + steg) % rammer.length;
    if (rammer[n].klar && rammer[n].har) { if (n !== aktiv) vis(n); else viste = 0; return; }
  }
}

addEventListener("message", e => {
  const r = rammer.find(x => x.el.contentWindow === e.source);
  if (!r || !e.data) return;
  if (e.data.nyheiter === "klar") { r.klar = true; if (harLagra(r)) r.har = true; }
  if (e.data.nyheiter === "har") r.har = true;
  if (e.data.nyheiter === "tom") { r.har = false; if (rammer[aktiv] === r) neste(); }
  if (aktiv < 0 && r.klar && r.har) vis(rammer.indexOf(r));
});

// Vi byter karusell litt før boka ville ha gått over til den neste, så ein
// aldri ser byrjinga på ei bok som så forsvinn.
setInterval(() => {
  if (aktiv < 0) return;
  let bok = null;
  try { bok = rammer[aktiv].el.contentDocument.querySelector(".bok.synleg"); } catch (e) {}
  if (!bok || bok === sistBok) return;
  sistBok = bok;
  viste++;
  if (viste >= BYTT) {
    clearTimeout(byttTid);
    byttTid = setTimeout(neste, Math.max(2000, rammer[aktiv].sek * 1000 - 1500));
  }
}, 200);

// Last sida på nytt kvar natt, så endringar i karusellen kjem med av seg sjølv.
(function nattleg() {
  const no = new Date(), neste = new Date(no);
  neste.setHours(5, 0, 0, 0);
  if (neste <= no) neste.setDate(neste.getDate() + 1);
  setTimeout(() => location.reload(), neste - no);
})();
</script>
</body>
</html>
