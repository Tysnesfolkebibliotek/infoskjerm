<!DOCTYPE html>
<html lang="nn"><head><meta charset="utf-8"><title>Lyrikk – skriftval</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<!-- Testside: same ord i ulike handskriftsskrifter frå Google Fonts, med «skrive fram»-animasjon.
     Berre for å velje skrift til poesitemaet. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="skriftlenkje" rel="stylesheet">
<style>
  body { margin: 0; background: #efeaf4; color: #231c33; font-family: system-ui, sans-serif; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 1rem 1rem .2rem; }
  p.info { margin: 0 1rem 1rem; color: #5d5470; font-size: .9rem; }
  .rutenett { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 0 1rem 2rem; }
  .kort { background: rgba(255,255,255,.45); border-radius: 12px; padding: 10px 14px 12px; }
  .nr { font-size: .8rem; color: #5d5470; }
  .ord { font-size: 64px; line-height: 1.5; color: #6b3fa0; white-space: nowrap; height: 1.5em;
    -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
    -webkit-mask-size: 230% 100%; mask-size: 230% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    animation: skriv 9s ease-in-out infinite; }
  @keyframes skriv {
    0%   { -webkit-mask-position: 100% 0; mask-position: 100% 0; opacity: 1; }
    35%  { -webkit-mask-position: 0% 0;   mask-position: 0% 0;   opacity: 1; }
    85%  { -webkit-mask-position: 0% 0;   mask-position: 0% 0;   opacity: 1; }
    95%  { -webkit-mask-position: 0% 0;   mask-position: 0% 0;   opacity: 0; }
    100% { -webkit-mask-position: 100% 0; mask-position: 100% 0; opacity: 0; }
  }
</style></head>
<body>
<h1>Lyrikk – vel skrift til poesitemaet</h1>
<p class="info">Alle er frie skrifter frå Google Fonts. Ordet blir «skrive fram» frå venstre, står ei stund og startar på nytt. Sei berre nummeret.</p>
<div class="rutenett" id="rutenett"></div>
<script>
  // [namn, vekt, storleiksjustering]
  const SKRIFTER = [
    ["Great Vibes", 400, 1], ["Parisienne", 400, .95], ["Allura", 400, 1.05], ["Pinyon Script", 400, .9],
    ["Alex Brush", 400, 1], ["Mrs Saint Delafield", 400, 1.1], ["Italianno", 400, 1.2], ["Tangerine", 700, 1.35],
    ["Dancing Script", 600, .95], ["Sacramento", 400, 1.1], ["Petit Formal Script", 400, .8], ["Herr Von Muellerhoff", 400, 1.15],
    ["Corinthia", 700, 1.25], ["Monsieur La Doulaise", 400, 1], ["Imperial Script", 400, 1], ["Homemade Apple", 400, .7],
  ];
  document.getElementById("skriftlenkje").href = "https://fonts.googleapis.com/css2?" +
    SKRIFTER.map(([n, v]) => "family=" + n.replace(/ /g, "+") + ":wght@" + v).join("&") + "&text=Lyrikk&display=swap";
  const rn = document.getElementById("rutenett");
  SKRIFTER.forEach(([n, v, k], i) => {
    const kort = document.createElement("div"); kort.className = "kort";
    kort.innerHTML = `<div class="nr">${i + 1}. ${n}</div><div class="ord" style="font-family:'${n}',cursive;font-weight:${v};font-size:${Math.round(64 * k)}px;animation-delay:${-(i % 4) * .4}s">Lyrikk</div>`;
    rn.append(kort);
  });
</script>
</body></html>
