<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<title>Infoskjerm</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #14110f; overflow: hidden; cursor: none; }
  iframe {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity 1.5s ease-in-out;
    pointer-events: none;
  }
  iframe.synleg { opacity: 1; }
</style>
</head>
<body>
<script>
// =========================================================================
// rotasjon.html — vekslar mellom sidene ein infoskjerm skal vise.
//
// Kva sider kvar skjerm viser, står i oppsett.json på GitHub:
//   https://github.com/Tysnesfolkebibliotek/infoskjerm/blob/main/oppsett.json
// Skjermen hentar fila på nytt ved starten av kvar runde og tek ho i bruk
// i runden etter. Endrar du ho, blir endringa teken i bruk innan om lag ein
// halvtime (GitHub-publisering pluss opptil to rundar), ofte raskare.
//
// Kvar skjerm vel oppsett med adressa i kiosk.desktop:
//   rotasjon.html?oppsett=skjerm1   → tysnes-infoskjerm
//   rotasjon.html?oppsett=skjerm2   → tysnes-infoskjerm-2 (standard utan ?oppsett=)
// Dei gamle namna fungerer framleis: «sakprosa» = skjerm1, «nyheiter» = skjerm2.
//
// Fila ligg lokalt på kvar skjerm (~/nytt-paa-hylla/rotasjon.html), så
// skjermen fungerer sjølv om GitHub eller nettet er nede.
// =========================================================================

const OPPSETT_URL = new URLSearchParams(location.search).get("kjelde")
  || "https://tysnesfolkebibliotek.github.io/infoskjerm/oppsett.json";
const GAMLE_NAMN = { sakprosa: "skjerm1", nyheiter: "skjerm2" };
const NYE_TIL_GAMLE = { skjerm1: "sakprosa", skjerm2: "nyheiter" };
const valt = new URLSearchParams(location.search).get("oppsett") || "skjerm2";
const NAMN = GAMLE_NAMN[valt] || valt;

// Reserve: blir brukt viss skjermen aldri har fått henta oppsett.json,
// eller viss ingen av sidene i oppsettet svarar.
const RESERVE = {
  skjerm2: [
    { lokal: "index.html",                                sekund: 180 },
    { url: "https://www.tysnesbibliotek.no/nn/kanal/1",   sekund: 180, frisk: true },
  ],
  skjerm1: [
    { lokal: "index.html?data=sakprosa.js&tittel=Frå+hylla", sekund: 180 },
    { url: "https://www.tysnesbibliotek.no/nn/kanal/2",      sekund: 180, frisk: true },
  ],
};

const OVERTONING_MS = 1500;      // må passe med «transition» i stilen over
const VENT_ETTER_LAST_MS = 1500; // gi sida tid til å teikne bilete og skrift
const MAKS_LASTETID_MS = 15000;  // gi opp ventinga om sida ikkje svarar
const SJEKK_NETT_MS = 8000;      // kor lenge vi ventar på svar før ei nettside blir hoppa over
const MINNE = "infoskjerm-oppsett:" + NAMN;
// --------------------------------------------------------------------------

// ---- Oppsettet ------------------------------------------------------------

// Godtek berre ei liste med sider som kvar har adresse og tal sekund.
function gyldig(sider) {
  return Array.isArray(sider) && sider.length > 0 && sider.every(s =>
    s && typeof (s.url || s.lokal) === "string" && Number(s.sekund) >= 5);
}

function lesMinne() {
  try { const s = JSON.parse(localStorage.getItem(MINNE)); return gyldig(s) ? s : null; }
  catch (e) { return null; }
}
function skrivMinne(sider) {
  try { localStorage.setItem(MINNE, JSON.stringify(sider)); } catch (e) {}
}

// Hentar oppsett.json. Gir sidene for denne skjermen, eller null ved feil.
async function hentOppsett() {
  try {
    const svar = await fetch(OPPSETT_URL + "?t=" + Date.now(),
      { cache: "no-store", signal: AbortSignal.timeout(SJEKK_NETT_MS) });
    if (!svar.ok) throw new Error("HTTP " + svar.status);
    const alt = await svar.json();
    // Godtek både nye («skjerm1») og gamle («sakprosa») namn i oppsett.json
    const sider = alt[NAMN] || alt[NYE_TIL_GAMLE[NAMN]];
    if (!gyldig(sider)) throw new Error("oppsett «" + NAMN + "» manglar eller er ugyldig");
    return sider;
  } catch (e) {
    console.warn("Fekk ikkje henta oppsett.json:", e.message);
    return null;
  }
}

// ---- Tidsstyring -----------------------------------------------------------
// Kvar side kan ha «periode», «dagar» og «tid». Sider utan desse blir alltid viste.
// «heil»: true lèt ein karusell vise alle bøkene éin gong; «sekund» er då øvre grense.
//   "periode": "12-01/12-24"            kvart år (kan gå over nyttår: "11-15/01-15")
//   "periode": "2026-10-01/2026-10-31"  berre den eine gongen
//   "dagar":   "man-fre", "lør,søn", "tys"
//   "tid":     "13:00-17:00"
const DAGAR = ["søn", "man", "tys", "ons", "tor", "fre", "lør"];
const dagnr = d => {
  const k = String(d).trim().toLowerCase().slice(0, 3).replace("tir", "tys").replace("lau", "lør").replace("sun", "søn");
  return DAGAR.indexOf(k);
};
function iPeriode(periode, no) {
  const [frå, til] = String(periode).split("/").map(x => x.trim());
  if (!frå || !til) return true;
  if (/^\d{4}-/.test(frå)) {                                   // med årstal: ein gong
    const lokal = new Date(no.getTime() - no.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    return lokal >= frå && lokal <= til;
  }
  const md = String(no.getMonth() + 1).padStart(2, "0") + "-" + String(no.getDate()).padStart(2, "0");
  return frå <= til ? (md >= frå && md <= til) : (md >= frå || md <= til);   // over nyttår
}
function påDag(dagar, no) {
  const idag = no.getDay();
  return String(dagar).split(",").some(del => {
    const [a, b] = del.split("-").map(dagnr);
    if (a < 0) return false;
    if (b === undefined || b < 0) return idag === a;
    return a <= b ? (idag >= a && idag <= b) : (idag >= a || idag <= b);
  });
}
function påTid(tid, no) {
  const [a, b] = String(tid).split("-").map(t => { const [h, m] = t.trim().split(":").map(Number); return h * 60 + (m || 0); });
  const min = no.getHours() * 60 + no.getMinutes();
  if (isNaN(a) || isNaN(b)) return true;
  return a <= b ? (min >= a && min < b) : (min >= a || min < b);
}
const tidsstyrt = s => s.periode || s.dagar || s.tid;
function gjeld(s, no = new Date()) {
  return (!s.periode || iPeriode(s.periode, no)) && (!s.dagar || påDag(s.dagar, no)) && (!s.tid || påTid(s.tid, no));
}
// Sidene som gjeld no. Gjeld ingen, viser vi dei utan tidsstyring, og elles alle.
function aktuelle(sider) {
  const no = new Date();
  const ut = sider.filter(s => gjeld(s, no));
  if (ut.length) return ut;
  const faste = sider.filter(s => !tidsstyrt(s));
  return faste.length ? faste : sider;
}

// ---- Sidene ---------------------------------------------------------------

const adresse = s => s.lokal || s.url;
const erNett = s => !s.lokal && /^https?:/i.test(s.url);

// Svarar nettsida? «no-cors» gjer at vi berre får vite om ho svarar,
// ikkje kva ho inneheld, men det er nok.
async function svarar(url) {
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: AbortSignal.timeout(SJEKK_NETT_MS) });
    return true;
  } catch (e) { return false; }
}

let SIDER = [], rammer = [], aktivJSON = "", aktivRamme = null;
let ALLE = null;   // heile oppsettet for skjermen, før tidsstyringa er brukt
let nyHenta = false;

function byggRammer(sider) {
  return sider.map(side => {
    const f = document.createElement("iframe");
    // Lokale sider blir lasta med ein gong. Nettsider blir lasta når dei skal
    // visast første gong, så vi kan sjekke at nettet er oppe først.
    f.src = side.lokal ? side.lokal : "about:blank";
    f.dataset.lasta = side.lokal ? "1" : "";
    document.body.append(f);
    return f;
  });
}

function bytOppsett(sider, json) {
  const gamle = rammer;
  SIDER = sider;
  aktivJSON = json;
  rammer = byggRammer(sider);
  // Dei gamle rammene blir fjerna når den nye sida har tona inn.
  setTimeout(() => gamle.forEach(r => r !== aktivRamme && r.remove()), OVERTONING_MS + 500);
}

// Nyheiter-sida (index.html) kan ta pause når ho ikkje blir vist, så ho
// hugsar kvar ho slapp. Andre sider bryr seg ikkje om desse beskjedane.
function send(ramme, beskjed, ekstra) {
  try { ramme.contentWindow.postMessage({ nyheiter: beskjed, ...ekstra }, "*"); } catch (e) {}
}
// «heil»: karusellen skal vise alle bøkene éin gong og seie frå når han er ferdig
const visBeskjed = r => send(r, "vis", { heil: !!(SIDER[rammer.indexOf(r)] || {}).heil });
window.addEventListener("message", e => {
  if (!e.data || !e.data.nyheiter) return;
  const r = [...document.querySelectorAll("iframe")].find(r => r.contentWindow === e.source);
  if (!r) return;
  if (e.data.nyheiter === "klar") { if (r === aktivRamme) visBeskjed(r); else send(r, "skjul"); }
  // Karusellen har vist alle bøkene sine: gå vidare (berre for sider med «heil»)
  if (e.data.nyheiter === "runde" && r === aktivRamme && nesteNo && (SIDER[rammer.indexOf(r)] || {}).heil) {
    clearTimeout(nesteTid); const f = nesteNo; nesteNo = null; f();
  }
  // Karusellar seier frå om dei har bøker å vise. Ein tom karusell (ingen
  // treff, eller ingen kontakt med Bibliofil og inga lagra liste) blir hoppa
  // over, så skjermen ikkje viser ei melding i fleire minutt.
  if (e.data.nyheiter === "tom" || e.data.nyheiter === "har") {
    r.dataset.tom = e.data.nyheiter === "tom" ? "1" : "";
    if (e.data.nyheiter === "tom" && r === aktivRamme && andreHar(r) && nesteNo) { clearTimeout(nesteTid); const f = nesteNo; nesteNo = null; f(); }
  }
});
// Finst det ei anna side som ikkje er meld tom?
const andreHar = r => rammer.some(x => x !== r && x.dataset.tom !== "1");

// Lastar sida og ventar til ho er ferdig, men ikkje lenger enn MAKS_LASTETID_MS.
function lastInn(r, url) {
  return new Promise(ferdig => {
    let gjort = false;
    const slutt = () => { if (!gjort) { gjort = true; setTimeout(ferdig, VENT_ETTER_LAST_MS); } };
    r.addEventListener("load", slutt, { once: true });
    setTimeout(slutt, MAKS_LASTETID_MS);
    r.src = url;
  });
}

// ---- Rotasjonen -----------------------------------------------------------

let hoppaOver = 0;
let nesteTid = null, nesteNo = null;   // tidtakaren til neste side, så ein tom karusell kan avbryte han

async function vis(n) {
  // Ny runde: finn ut kva sider som gjeld no (oppsett og klokke), og spør
  // etter eit ferskt oppsett til neste runde.
  if (n === 0) {
    // På reserven (ingen sider svarte) blir vi verande til nettet er tilbake
    if (ALLE && (aktivJSON !== "reserve" || nyHenta)) {
      const sider = aktuelle(ALLE), json = JSON.stringify(sider);
      if (json !== aktivJSON) bytOppsett(sider, json);
    }
    nyHenta = false;
    hentOppsett().then(sider => { if (sider) { skrivMinne(sider); ALLE = sider; nyHenta = true; } });
  }

  const side = SIDER[n], r = rammer[n];
  const neste = () => vis((n + 1) % SIDER.length);

  // Karusell som har meldt at han ikkje har bøker: hopp over, så lenge
  // det finst andre sider å vise
  if (r.dataset.tom === "1" && andreHar(r)) return neste();

  // Nettsider blir sjekka før dei blir viste. Svarar dei ikkje, hoppar vi
  // over dei, og den førre sida blir ståande.
  if (erNett(side)) {
    if (!(await svarar(side.url))) {
      hoppaOver++;
      // Svarar ingen av sidene, går vi over til reserven.
      if (hoppaOver >= SIDER.length) {
        hoppaOver = 0;
        const json = "reserve";
        if (aktivJSON !== json) { bytOppsett(RESERVE[NAMN] || RESERVE.skjerm2, json); return vis(0); }
        // Reserven svarar heller ikkje: vent litt før vi prøver igjen.
        return setTimeout(neste, 30000);
      }
      return neste();
    }
    if (side.frisk || !r.dataset.lasta) {
      await lastInn(r, side.url);
      r.dataset.lasta = "1";
      // Karusellen kan ha meldt «tom» medan han lasta
      if (r.dataset.tom === "1" && andreHar(r)) return neste();
    }
  }
  hoppaOver = 0;

  const førre = aktivRamme;
  aktivRamme = r;
  r.classList.add("synleg");
  visBeskjed(r);

  if (førre && førre !== r) {
    førre.classList.remove("synleg");
    send(førre, "skjul");
    if (!rammer.includes(førre)) {
      // Frå eit gammalt oppsett: fjern ho når ho har tona ut.
      setTimeout(() => førre.remove(), OVERTONING_MS + 200);
    } else {
      // Tøm ei «frisk» side når ho har tona ut, så ho ikkje køyrer i bakgrunnen.
      const i = rammer.indexOf(førre);
      if (SIDER[i] && SIDER[i].frisk) {
        setTimeout(() => { if (aktivRamme !== førre) { førre.src = "about:blank"; } }, OVERTONING_MS + 200);
      }
    }
  }
  nesteNo = neste;
  nesteTid = setTimeout(() => { nesteNo = null; neste(); }, Number(side.sekund) * 1000);
}

// Ved oppstart: prøv å hente oppsett.json først. Går ikkje det, bruk det sist
// henta oppsettet, og har vi heller ikkje det, bruk reserven.
(async function start() {
  const fersk = await hentOppsett();
  if (fersk) skrivMinne(fersk);
  ALLE = fersk || lesMinne();
  if (ALLE) { const sider = aktuelle(ALLE); bytOppsett(sider, JSON.stringify(sider)); }
  else bytOppsett(RESERVE[NAMN] || RESERVE.skjerm2, "reserve");
  vis(0);
})();
</script>
</body>
</html>
