<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<title>Lokalhistorisk arkiv i Tysnes (Beta)</title>
<!--
  lokalhistorie.html — bilete frå den lokalhistoriske bildesamlinga.  (BETA)

  Ligg lokalt på skjermen (~/nytt-paa-hylla/) og les lokalhistorie.js,
  som hent-lokalhistorie.sh lagar éin gong per dag.

  Modusar:
    lokalhistorie.html?modus=dagens          → «Dagens bilete» (det same heile dagen)
    lokalhistorie.html?modus=karusell&sek=20 → fleire bilete som vekslar (sek = sekund per bilete)
-->
<style>
  /* Same variablar og stil som karusellane (index.html) og plakatane.
     Fargane og skriftene kjem frå tema.js og skrifter.js på GitHub Pages;
     manglar nettet, blir standardfargane («Kveld») under brukte. */
  :root {
    --bakgrunn: #14110f; --tekst: #f5efe6; --dempa: #b8ab98; --aksent: #e8a33d;
    --brikke: rgba(255,255,255,.10); --aksent-tekst: #1b140c;
    --skrift: "Ubuntu", "DejaVu Sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: none;
               background: var(--bakgrunn); color: var(--tekst); font-family: var(--skrift); }
  header { position: absolute; top: 5vh; left: 7vw; right: 7vw; display: flex; flex-direction: column; gap: 1.2vh;
           padding-right: var(--symbol-plass, 0); z-index: 2; }
  .avdeling { font-size: 3vw; color: var(--aksent-tekstfarge, var(--aksent)); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
  .overskrift { font-weight: var(--vekt-overskrift, 700); font-size: calc(6.2vw * var(--skala-overskrift, 1)); letter-spacing: .01em;
                font-family: var(--skrift-overskrift, var(--skrift)); line-height: 1.1; }
  :root[data-versalar] .overskrift { text-transform: uppercase; letter-spacing: .05em; }
  .beta { position: absolute; top: 5.4vh; right: 7vw; font-size: 1.8vw; letter-spacing: .12em; font-weight: 700; z-index: 2;
          background: var(--brikke); color: var(--dempa); border-radius: 99px; padding: .4vh 1.6vw; }
  .bilete { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease; }
  .bilete.synleg { opacity: 1; }
  .ramme { position: absolute; top: 19vh; left: 6vw; right: 6vw; height: 46vh; display: flex; align-items: center; justify-content: center; }
  .ramme img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: .6vw;
               box-shadow: 0 2vh 5vh rgba(0,0,0,.45); }
  .synleg .ramme img { animation: zoom 40s ease-out both; }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.04); } }
  .tekst { position: absolute; top: 68vh; left: 7vw; right: 7vw; bottom: 11vh; overflow: hidden; text-align: center; }
  h1 { font-family: var(--skrift-tittel, var(--skrift)); font-weight: var(--vekt-tittel, 700); font-size: calc(4.6vw * var(--skala-tittel, 1));
       line-height: 1.2; }
  .meta { font-size: 3vw; margin-top: 1.4vh; opacity: .92; }
  .skildring { font-size: 2.8vw; line-height: 1.5; color: var(--dempa); margin: 2.4vh auto 0; max-width: 82vw;
               display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  /* Botnen som på karusellane: biblioteknamnet til venstre, nedteljingshjulet til høgre */
  footer { position: absolute; bottom: 4vh; left: 7vw; right: 7vw; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .botnnamn { font-size: 2.8vw; color: var(--tekst); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .botnnamn b { font-weight: 700; }
  .hjul { display: block; width: 4.6vh; height: 4.6vh; flex: none; transform: rotate(-90deg); }
  .hjul circle { fill: none; stroke-width: 3.5; }
  .hjul .hjul-spor { stroke: var(--spor, rgba(255,255,255,.12)); }
  #hjul { stroke: var(--aksent); stroke-linecap: round; stroke-dasharray: 94.25px; stroke-dashoffset: 0px; }
  #melding { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             text-align: center; font-size: 3vw; color: var(--dempa); padding: 10vw; }
  /* Liggjande skjerm: biletet til venstre, teksten til høgre. Storleikane
     følgjer høgda (vh) i staden for breidda, så teksten ikkje blir for stor. */
  @media (orientation: landscape) {
    header { top: 5vh; left: 4vw; right: 4vw; }
    .avdeling { font-size: 2.4vh; }
    .overskrift { font-size: calc(5.4vh * var(--skala-overskrift, 1)); }
    .beta { top: 5.6vh; right: 4vw; font-size: 1.5vh; padding: .4vh 1vh; }
    .ramme { top: 20vh; bottom: 13vh; left: 4vw; right: 42vw; height: auto; }
    .ramme img { border-radius: .6vh; }
    .tekst { top: 20vh; bottom: 13vh; left: 61vw; right: 4vw; text-align: left;
             display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: calc(4.4vh * var(--skala-tittel, 1)); }
    .meta { font-size: 2.6vh; }
    .skildring { font-size: 2.3vh; max-width: none; margin: 2.4vh 0 0; -webkit-line-clamp: 8; }
    footer { left: 4vw; right: 4vw; }
    .botnnamn { font-size: 2.6vh; }
    #melding { font-size: 3vh; }
  }
</style>
<script src="https://tysnesfolkebibliotek.github.io/infoskjerm/tema.js"></script>
<script src="https://tysnesfolkebibliotek.github.io/infoskjerm/skrifter.js"></script>
</head>
<body>
<header><div class="avdeling">Lokalhistorisk arkiv i Tysnes</div><div class="overskrift" id="overskrift">Dagens bilete</div></header>
<span class="beta">BETA</span>
<footer>
  <span class="botnnamn"><b>Tysnes</b> folkebibliotek</span>
  <svg class="hjul" viewBox="0 0 36 36" aria-hidden="true"><circle class="hjul-spor" cx="18" cy="18" r="15"/><circle id="hjul" cx="18" cy="18" r="15"/></svg>
</footer>
<div id="melding"></div>
<script>
const P = new URLSearchParams(location.search);
const MODUS = P.get("modus") === "karusell" ? "karusell" : "dagens";
const SEK = Math.max(5, Number(P.get("sek")) || 20);
document.getElementById("overskrift").textContent = P.get("tittel") || (MODUS === "dagens" ? "Dagens bilete" : "Glimt frå gamle Tysnes");

// Tema og skrift som i karusellane: ?tema=fjord&skrift=par-klassisk (standard: Kveld)
(function () {
  const id = P.get("tema") || "kveld";
  const t = typeof TEMA_ETTER_ID !== "undefined" ? TEMA_ETTER_ID[id] : null;
  if (t && id !== "kveld") document.documentElement.dataset.tema = id;
  const skrift = P.get("skrift") && P.get("skrift") !== "standard" ? P.get("skrift") : (t && t.skrift);
  if (skrift && typeof brukSkrift === "function") try { brukSkrift(skrift); } catch (e) {}
})();

// ---- Lese MARC-felta. Formatet er ikkje dokumentert, så vi les romsleg:
// både tekst («*505  $a…»), MARC-in-JSON og objekt med tag/kode-felt.
function marcFelt(m) {
  const ut = [];   // [tag, delfelt, verdi]
  if (!m) return ut;
  if (typeof m === "string") {
    for (const linje of m.split(/\r?\n/)) {
      const t = linje.match(/^\s*\*?(\d{3})(.*)$/); if (!t) continue;
      for (const d of t[2].split(/[$‡\u001f]/).slice(1)) if (d.length > 1) ut.push([t[1], d[0], d.slice(1).trim()]);
    }
    return ut;
  }
  (function gå(n, tag) {
    if (Array.isArray(n)) return n.forEach(x => gå(x, tag));
    if (!n || typeof n !== "object") return;
    const t = n.tag ?? n.felt ?? n.field ?? n.t;
    if (t != null && /^\d{1,3}$/.test(String(t))) tag = String(t).padStart(3, "0");
    const kode = n.delfelt ?? n.code ?? n.kode ?? n.subfield;
    const verdi = n.value ?? n.data ?? n.verdi ?? n.tekst;
    if (tag && kode != null && typeof verdi === "string") { ut.push([tag, String(kode), verdi.trim()]); return; }
    for (const [k, v] of Object.entries(n)) {
      if (/^\d{3}$/.test(k)) gå(v, k);
      else if (tag && /^[a-z0-9]$/.test(k) && typeof v === "string") ut.push([tag, k, v.trim()]);
      else if (typeof v === "object") gå(v, tag);
    }
  })(m, null);
  return ut;
}
const hent = (felt, tag, kode = "a") => felt.filter(f => f[0] === tag && f[1] === kode).map(f => f[2]).filter(Boolean);

// Fjern registreringsnotat o.l. på slutten av skildringa, og kort ned.
function vask(s) {
  if (!s) return "";
  // Bibliofil-format: { tag: 505, verdi: [{ delfelt: "a", verdi: "…" }] }
  s = s.replace(/(^|[\s.,;])\s*(Reg\.?\s|Registrert|Informant|Gard\.? og ætt|Ættesoga|Kjelde|Kilde)[\s\S]*$/i, "$1").trim();
  if (s.length > 320) {
    const k = s.slice(0, 320), punktum = k.lastIndexOf(". ");
    s = punktum > 150 ? k.slice(0, punktum + 1) : k.slice(0, k.lastIndexOf(" ")) + " …";
  }
  return s;
}

// Finn postane i svaret, kvar dei enn ligg.
function postar(d) {
  const ut = [];
  (function gå(n) {
    if (Array.isArray(n)) return n.forEach(gå);
    if (!n || typeof n !== "object") return;
    if (n.stit_bilde) { ut.push(n); return; }
    Object.values(n).forEach(gå);
  })(d);
  return ut.map(p => {
    const f = marcFelt(p.marcpost);
    const bilete = String(Array.isArray(p.stit_bilde) ? p.stit_bilde[0] : p.stit_bilde).replace(".str1.", ".str4.");
    const stad = [...new Set(hent(f, "651"))].join(", ");
    const år = hent(f, "260", "c")[0] || (p.stit_utgaar > 0 ? String(p.stit_utgaar) : "");
    const foto = hent(f, "100")[0] || "";
    return { titnr: p.titnr, tittel: String(p.stit_tittel || "").replace(/\s*[\/:;]\s*$/, ""), bilete,
             meta: [stad, år.replace(/[.,;]$/, ""), foto && "Foto: " + foto.replace(/[.,;]$/, "")].filter(Boolean).join(" · "),
             skildring: vask(hent(f, "505").join(" ")) };
  }).filter(p => /^https?:/.test(p.bilete));
}

// ---- Data: les lokalhistorie.js på nytt kvar gong sida blir vist,
// så nye bilete kjem med utan at Chromium må starte på nytt.
let LISTE = [], DATO = "";
function lesData() {
  return new Promise(ok => {
    const s = document.createElement("script");
    s.src = "lokalhistorie.js?t=" + Date.now();
    s.onload = s.onerror = () => { s.remove(); ok(); };
    document.head.append(s);
  }).then(() => {
    if (window.LOKALHISTORIE_DATO && window.LOKALHISTORIE_DATO !== DATO) {
      try { LISTE = postar(window.LOKALHISTORIE); DATO = window.LOKALHISTORIE_DATO; } catch (e) { console.error(e); }
    }
  });
}

// ---- Vising
const lag = (tag, kl, tekst) => { const e = document.createElement(tag); if (kl) e.className = kl; if (tekst) e.textContent = tekst; return e; };
let nr = 0, tidtakar = null, aktiv = null;

// Nedteljingshjulet byrjar fullt og tømmer seg, som på karusellane.
// Karusell: éin runde per bilete. Dagens bilete: tida sida står på skjermen
// (rotasjon.html sender ho med «vis»); utan rotasjon 45 sekund om att og om att.
let hjulAnim = null, sideMs = 0;
function teljNed(ms) {
  if (hjulAnim) hjulAnim.cancel();
  hjulAnim = document.getElementById("hjul").animate(
    [{ strokeDashoffset: "0px" }, { strokeDashoffset: "94.25px" }],
    { duration: ms, easing: "linear", fill: "forwards", iterations: MODUS === "dagens" && !sideMs ? Infinity : 1 });
}

function last(p) {
  return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = p.bilete; });
}
async function visBilete(p) {
  const img = await last(p);
  if (!img) return false;
  const b = lag("div", "bilete"), r = lag("div", "ramme"), t = lag("div", "tekst");
  r.append(img);
  t.append(lag("h1", "", p.tittel));
  if (p.meta) t.append(lag("div", "meta", p.meta));
  if (p.skildring) t.append(lag("div", "skildring", p.skildring));
  b.append(r, t);
  document.body.append(b);
  b.offsetWidth;
  b.classList.add("synleg");
  const gamal = aktiv; aktiv = b;
  if (gamal) { gamal.classList.remove("synleg"); setTimeout(() => gamal.remove(), 2000); }
  document.getElementById("melding").textContent = "";
  return true;
}
// Same bilete heile dagen: vel ut frå datoen.
const dagnummer = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);

async function neste() {
  clearTimeout(tidtakar);
  if (!LISTE.length) { document.getElementById("melding").textContent = "Ingen bilete henta enno."; return melde("tom"); }
  for (let prøv = 0; prøv < Math.min(5, LISTE.length); prøv++) {
    const i = MODUS === "dagens" ? (dagnummer() + prøv) % LISTE.length : nr++ % LISTE.length;
    if (await visBilete(LISTE[i])) { melde("har"); break; }
  }
  teljNed(MODUS === "karusell" ? SEK * 1000 : (sideMs || 45000));
  if (MODUS === "karusell") tidtakar = setTimeout(neste, SEK * 1000);
}

// ---- Samspel med rotasjon.html
const iRotasjon = window.parent !== window && !P.has("forhand");   // forhand=1: førehandsvising på oversikta
function melde(b) { if (iRotasjon) parent.postMessage({ nyheiter: b }, "*"); }
window.addEventListener("message", async e => {
  if (!e.data || !e.data.nyheiter) return;
  if (e.data.nyheiter === "vis") { sideMs = Number(e.data.att) || 0; await lesData(); neste(); }
  if (e.data.nyheiter === "skjul") clearTimeout(tidtakar);
});
lesData().then(() => { if (!iRotasjon) neste(); melde(LISTE.length ? "har" : "tom"); melde("klar"); });
</script>
</body>
</html>
