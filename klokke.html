<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Klokke, vêr og ferje – Tysnes folkebibliotek</title>
<!--
  klokke.html — klokkeside for infoskjermane: opningstid, klokke, vêr og neste ferje.

  Utforming frå 12.11.2026: «tavle» i sand og petrol med Poppins, éin ting om gongen under klokka.

  Lenkje til oversikta («+ Legg til side»):
    https://tysnesfolkebibliotek.github.io/infoskjerm/klokke.html#vis=1

  Valfritt i lenkja (etter #) – vel det helst i plakatbyggjaren (malen «Klokke, vêr og ferje»):
    variant=ver         klokke med meir vêr (vind, nedbør, høgast/lågast i dag)
    variant=vertavle    vêret i sentrum: lita klokke, dei neste 6 timane, i dag og i morgon
    utan=skule,ferje    ta bort boksar: ope (opningstid), skule, ver, sol, ferje, dag (Dagen i dag), fare (farevarsel)
    veksle=0            vis alt på éin gong (standard: éin ting om gongen under klokka, som vekslar)
    farge=petrol        eigne lyse fargar: petrol (standard), papir, mynte, rosa, kalk, betong, himmel,
                        salvie, aprikos, lavendel, sennep, havbla. farge=auto: Lys om dagen, Kveld om kvelden
    skrift=poppins      skrift frå Google Fonts: poppins (standard), inter, lora; skrift=standard gir Ubuntu
    fodd=1              «Fødd i dag»: forfattarar fødde i dag som biblioteket har bøker av
    kveld=1 / kveld=0   med farge=auto: tving «Kveld» eller «Lys» (elles Kveld når sola har gått ned)
    tema=fjord          bruk eit tema frå tema.js heile døgnet i staden for fargane under
    teljar=hjul         nedteljingshjul som på karusellane (standard: linje nedst som på plakatane)
    tid=19:30           lat som klokka er 19:30 (for å teste opningstida)
    dag=lør             lat som det er laurdag (for å teste opningstida)

  Kjelder (alle opne og gratis):
    Vêr og sol: MET Norge (api.met.no) — Locationforecast, Sunrise og MetAlerts (farevarsel), henta kvar 30. min.
    Ferje:      Entur (api.entur.io) — avgangar frå Våge kai (NSR:StopPlace:58466) mot Halhjem, henta kvart 2. min.
    Fødd i dag: Wikidata (query.wikidata.org) og Bibliofil (SRU), henta éin gong per døgn.
    Dagen i dag: nynorsk Wikipedia (nn.wikipedia.org) – boksen på framsida, henta éin gong per døgn.
    Opningstid: Bibliotek.no (tysnesbibliotek.no/api/v1/libraries) — same tider som på nettsida, henta kvar time.
  Opningstidene blir endra på nettsida (redaktørverktøyet), ikkje her. Er nettsida nede, blir
  sist henta tider brukte; har sida aldri fått svar, blir opningstider.json brukt som reserve.
  Skuletimane står i opningstider.json.

  Utan nett går klokka og opningstida som før. Vêr og ferje blir viste frå
  sist henta data så lenge dei er ferske nok, elles blir boksane skjulte.
-->
<style>
  /* Utforming «tavle» (12.11.2026): ingen boksar eller pillar. Klokka og datoen
     øvst, deretter rader med tynne skiljeliner: etikett til venstre, verdi til
     høgre, same rytme i alle radene. Farevarselet er ei farga stripe heilt øvst.
     Same variablar og skrift som karusellane (index.html) og plakatane, så tema
     frå tema.js verkar. Standardfargane er temaet «Kveld»; om dagen «Lys».
     1 rem = 10 px på ein ståande 1080 × 1920-skjerm. Liggjande skjerm: same
     utforming, skalert ned og midtstilt. */
  :root { font-size: min(calc(100vw / 108), calc(100vh / 192));
          --bakgrunn: #14110f; --tekst: #f5efe6; --dempa: #b8ab98; --aksent: #e8a33d;
          --brikke: rgba(255,255,255,.10); --aksent-tekst: #1b140c; --spor: rgba(255,255,255,.12);
          --skrift: "Ubuntu", "DejaVu Sans", "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
          --gron: #7fd1a0;
          --etikett: 25rem;   /* breidda på etikettkolonnen */
          --verdi: 6rem;      /* storleiken på verdiane i radene */
          --rad: 4rem; }      /* luft over og under kvar rad */
  :root[data-tema="lys"] { --gron: #2e7d4f; }
  /* Eigne lyse fargar til klokkesida (#farge=…). Gjeld heile døgnet og går framfor tema. */
  :root[data-farge] { --spor: color-mix(in srgb, var(--tekst) 14%, transparent); --brikke: color-mix(in srgb, var(--tekst) 8%, transparent); }
  :root[data-farge="himmel"]   { --bakgrunn: #dcebf5; --tekst: #0f2a3d; --dempa: #4d6779; --aksent: #1f6fa8; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="salvie"]   { --bakgrunn: #e1eadc; --tekst: #1b2a1d; --dempa: #55675a; --aksent: #4a7a33; --aksent-tekst: #fff; --gron: #2f7a3e; }
  :root[data-farge="aprikos"]  { --bakgrunn: #f7e3d4; --tekst: #3a1e10; --dempa: #7c5a47; --aksent: #c2502a; --aksent-tekst: #fff; --gron: #2f7a4a; }
  :root[data-farge="lavendel"] { --bakgrunn: #e8e4f3; --tekst: #231c3d; --dempa: #605a7b; --aksent: #6a4fb3; --aksent-tekst: #fff; --gron: #2e7a50; }
  :root[data-farge="sennep"]   { --bakgrunn: #f3cd52; --tekst: #2a2006; --dempa: #66541c; --aksent: #2a2006; --aksent-tekst: #f3cd52; --gron: #1f5f35; }
  :root[data-farge="papir"]    { --bakgrunn: #f4efe6; --tekst: #1d1b18; --dempa: #6e665c; --aksent: #c8102e; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="mynte"]    { --bakgrunn: #d7efe3; --tekst: #0e3b2e; --dempa: #4a6c60; --aksent: #d9582f; --aksent-tekst: #fff; --gron: #1f7a46; }
  :root[data-farge="rosa"]     { --bakgrunn: #f6dfe5; --tekst: #3d1730; --dempa: #7c5468; --aksent: #b5315f; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="kalk"]     { --bakgrunn: #eeeee6; --tekst: #1a2340; --dempa: #5d6377; --aksent: #e4572e; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="petrol"]   { --bakgrunn: #efe4cf; --tekst: #133b45; --dempa: #5a6d6f; --aksent: #0f7c8a; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="betong"]   { --bakgrunn: #e6e7e9; --tekst: #202326; --dempa: #5f6368; --aksent: #f05a14; --aksent-tekst: #fff; --gron: #2a7a4b; }
  :root[data-farge="havbla"]   { --bakgrunn: #3a74b8; --tekst: #ffffff; --dempa: #d3e2f3; --aksent: #ffd36b; --aksent-tekst: #1b2a40; --gron: #b7f0c9; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: none; background: var(--bakgrunn); color: var(--tekst);
               font-family: var(--skrift); transition: background 1s, color 1s; }
  .side { position: absolute; left: 50%; top: 50%; width: 108rem; height: 192rem; transform: translate(-50%, -50%);
          padding: 9.6rem 7.56rem 7.68rem; display: flex; flex-direction: column; }
  .tal { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---- Farevarsel: farga stripe heilt øvst, kant til kant (fargane er MET sine) ---- */
  .fare { display: grid; grid-template-columns: var(--etikett) 1fr; column-gap: 3rem; align-items: baseline;
          margin: -9.6rem -7.56rem 6rem; padding: 4.4rem 7.56rem 4rem;
          background: #f2c230; color: #1b140c; }
  .fare.oransje { background: #f08c25; }
  .fare.raudt { background: #d7302b; color: #fff; }
  .fare .namn { color: inherit; opacity: .75; }
  .fare b { display: block; font-size: 4.6rem; font-weight: 700; line-height: 1.15; }
  .fare span { display: block; font-size: 3.2rem; margin-top: .8rem; }

  /* ---- Klokka og datoen ---- */
  .klokkeblokk { padding-bottom: 5.6rem; }
  .klokke { font-size: 24rem; font-weight: 300; line-height: .85; letter-spacing: -.04em; white-space: nowrap; margin-left: -.06em; }
  .klokke .kolon { transition: opacity .5s ease-in-out; }
  .klokke .kolon.av { opacity: .25; }
  .dato { display: flex; align-items: baseline; gap: 2.4rem; margin-top: 3.2rem; white-space: nowrap; }
  .dato b { font-size: 4.6rem; font-weight: 700; }
  .dato span { font-size: 3.4rem; color: var(--dempa); }

  /* ---- Radene ---- */
  /* Klokka og radene står midt i den ledige plassen mellom farevarselet og botnen */
  .midt { margin-block: auto; }
  .rader { display: flex; flex-direction: column; }
  .rad { display: grid; grid-template-columns: var(--etikett) 1fr; column-gap: 3rem; align-items: baseline;
         padding: var(--rad) 0; border-top: .2rem solid var(--spor); }
  .namn { font-size: 2.6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--dempa); }
  .verdi { font-size: var(--verdi); font-weight: 700; line-height: 1.1; min-width: 0; }
  .verdi .lett { font-weight: 300; }
  .under { display: block; font-size: 3.4rem; font-weight: 400; color: var(--dempa); margin-top: 1.2rem; line-height: 1.3; }
  .under b { color: var(--tekst); font-weight: 700; }
  .under:empty { display: none; }
  #dagMeir { white-space: pre-line; }
  #dagHovud .lett { font-weight: 400; }
  .aksent { color: var(--aksent-tekstfarge, var(--aksent)); }
  .gron, .skule.fri .verdi > span:first-child { color: var(--gron); }

  /* Opningstida: liten prikk framfor (grøn = betjent, aksent = meirope, dempa = stengt) */
  .prikk { display: inline-block; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--aksent);
           margin-right: 1.8rem; vertical-align: .6rem; }
  .ope.betjent .prikk { background: var(--gron); }
  .ope.stengt .prikk { background: var(--dempa); }

  /* Vêret no: temperatur, ikon og skildring på éi linje */
  .vernu { display: flex; align-items: center; gap: 2.8rem; }
  .vernu svg { width: 9rem; height: 8rem; flex: none; }
  .vernu .grad { font-size: 11rem; font-weight: 300; line-height: .9; letter-spacing: -.03em; white-space: nowrap; }
  .vernu .skildring { font-size: 4.6rem; font-weight: 700; line-height: 1.15; min-width: 0; }
  .vernu .skildring span { display: block; font-size: 3.4rem; font-weight: 400; color: var(--dempa); margin-top: .6rem; }
  .vernu .skildring span:empty { display: none; }
  .verlinjer { display: flex; flex-direction: column; gap: 1rem; margin-top: 2.8rem; font-size: 3.4rem; font-weight: 400; line-height: 1.3; color: var(--dempa); }
  .verlinjer b { color: var(--tekst); font-weight: 700; }
  .verlinjer > div { display: flex; align-items: flex-start; gap: 1.6rem; }
  .verlinjer svg { margin-top: .4rem; }
  .verlinjer svg { width: 3.6rem; height: 3.6rem; flex: none; }

  /* Vêrtavla: dei neste timane og dei neste dagane, utan ramer */
  .timar { display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 3.6rem; }
  .timar > div { display: flex; flex-direction: column; align-items: flex-start; gap: .8rem; }
  .timar span { font-size: 2.8rem; font-weight: 400; color: var(--dempa); }
  .timar svg { width: 6.4rem; height: 5.6rem; margin-left: -.6rem; }
  .timar b { font-size: 4rem; font-weight: 700; }
  .dagar { display: flex; flex-direction: column; gap: 1.4rem; margin-top: 3.6rem; }
  .dagar > div { display: flex; align-items: center; gap: 2.4rem; }
  .dagar > div > div { display: flex; align-items: baseline; gap: 2rem; }
  .dagar svg { width: 5.6rem; height: 5rem; flex: none; }
  .dagar span { display: inline-block; min-width: 17rem; font-size: 3.6rem; font-weight: 400; color: var(--dempa); }
  .dagar b { font-size: 4.4rem; font-weight: 700; white-space: nowrap; }

  /* Vêrtavla: lita klokke, større vêr */
  :root.v-vertavle .klokke { font-size: 14rem; }
  :root.v-vertavle .dato { margin-top: 2rem; }
  :root.v-vertavle .vernu .grad { font-size: 15rem; }
  :root.v-vertavle .vernu svg { width: 12rem; height: 10.5rem; }

  /* Fødd i dag: namn og skildring, éin per linje */
  #foddListe { display: flex; flex-direction: column; gap: 2.4rem; }
  .person .pnamn { display: block; font-size: 4.6rem; font-weight: 700; line-height: 1.1; }
  .person .skild { display: block; font-size: 3.2rem; font-weight: 400; color: var(--dempa); margin-top: .6rem; }

  /* Ekstra luft mellom klokka og radene når det er plass (sjå tilpass()) */
  :root.luft .klokkeblokk { padding-bottom: 8rem; }
  :root.luft { --rad: 4.8rem; }
  /* Når alt ikkje får plass, blir sida tettare i to steg (sjå tilpass()) */
  :root.tett { --rad: 3rem; --verdi: 5.4rem; }
  :root.tett .klokke { font-size: 19rem; }
  :root.tett .klokkeblokk { padding-bottom: 4rem; }
  :root.tett .vernu .grad { font-size: 9rem; }
  :root.tett.v-vertavle .klokke { font-size: 11rem; }
  :root.tett.v-vertavle .vernu .grad { font-size: 12rem; }
  :root.tett .timar, :root.tett .dagar, :root.tett .verlinjer { margin-top: 2.4rem; }
  :root.tettare { --rad: 2.2rem; --verdi: 4.8rem; }
  :root.tettare .klokke { font-size: 15rem; }
  :root.tettare .dato { margin-top: 1.6rem; }
  :root.tettare .dato b { font-size: 4rem; }
  :root.tettare .klokkeblokk { padding-bottom: 3rem; }
  :root.tettare .timar svg { width: 5rem; height: 4.4rem; }
  :root.tettare #foddListe { gap: 1.6rem; }
  :root.tettare .person .pnamn { font-size: 4rem; }

  /* ---- Veksle (#veksle=1): klokka står fast, éi rad om gongen under, i stor skrift ---- */
  .punkt { display: none; }
  :root.veksle .midt { margin-block: auto; }
  :root.veksle .klokke { font-size: 26rem; }
  :root.veksle .dato b { font-size: 5.6rem; }
  :root.veksle .dato span { font-size: 4rem; }
  :root.veksle .klokkeblokk { padding-bottom: 7rem; border-bottom: .2rem solid var(--spor); margin-bottom: 7rem; }
  /* Alle radene i same rute oppå kvarandre: høgda blir den høgaste rada, så prikkane står i ro */
  :root.veksle .rader { display: grid; min-height: 50rem; }
  :root.veksle .rad { display: block; border: 0; padding: 0; grid-area: 1 / 1;
                      opacity: 0; transform: translateY(2rem); transition: opacity .7s ease, transform .7s ease; pointer-events: none; }
  :root.veksle .rad.aktiv { opacity: 1; transform: none; }
  :root.veksle .namn { font-size: 3.6rem; color: var(--aksent-tekstfarge, var(--aksent)); margin-bottom: 4rem; }
  :root.veksle { --verdi: 10.4rem; }
  :root.veksle #opeNo { white-space: nowrap; }
  :root.veksle .verdi { line-height: 1.05; }
  :root.veksle .under { font-size: 5.4rem; margin-top: 2.8rem; }
  :root.veksle .prikk { width: 3rem; height: 3rem; margin-right: 3.2rem; vertical-align: 2rem; }
  :root.veksle .vernu .grad { font-size: 24rem; }
  :root.veksle .vernu svg { width: 16rem; height: 14rem; }
  :root.veksle .vernu .skildring { font-size: 7rem; }
  :root.veksle .vernu .skildring span { font-size: 5rem; }
  :root.veksle .verlinjer { font-size: 4.8rem; margin-top: 4.8rem; gap: 2rem; }
  :root.veksle .verlinjer svg { width: 5rem; height: 5rem; }
  :root.veksle .timar { margin-top: 4.4rem; }
  :root.veksle .timar span { font-size: 3.4rem; }
  :root.veksle .timar svg { width: 8rem; height: 7rem; }
  :root.veksle .timar b { font-size: 5rem; }
  :root.veksle .dagar span { font-size: 4.2rem; min-width: 20rem; }
  :root.veksle .dagar b { font-size: 5.2rem; }
  :root.veksle #foddListe { gap: 3.6rem; }
  :root.veksle .person .pnamn { font-size: 7.6rem; }
  :root.veksle .person .skild { font-size: 4.6rem; }
  :root.veksle #ferjeom { display: block; }
  /* Små prikkar som viser kor mange ting som vekslar, og kva som står no */
  :root.veksle .punkt { display: flex; gap: 1.6rem; margin-top: 4rem; }
  .punkt i { width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--spor); transition: background .5s, width .5s; }
  .punkt i.no { background: var(--aksent); width: 4.4rem; border-radius: 99rem; }
  /* Vêrtavla med veksling: klokka litt mindre, så timane får plass */
  :root.veksle.v-vertavle .klokke { font-size: 22rem; }

  /* Botnen som på karusellane og plakatane (index.html / plakat.html) */
  footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 3rem; }
  .botnmerke { display: flex; flex-direction: column; align-items: flex-start; gap: .77rem; flex: none; }
  .kjelde { font-size: 1.73rem; color: var(--dempa); opacity: .8; }
  .kjelde:empty { display: none; }
  .botnnamn { font-size: 3.02rem; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
  .botnnamn b { font-weight: 700; }
  .hjul { width: 8.8rem; height: 8.8rem; flex: none; transform: rotate(-90deg); }
  .hjul circle { fill: none; stroke-width: 3.5; }
  .hjul .spor { stroke: var(--spor); }
  /* Nedteljing som på plakatane: tynn linje nedst. Med #teljar=hjul: hjulet som på karusellane. */
  .nedteljing { position: fixed; left: 0; right: 0; bottom: 0; height: .55vh; background: var(--aksent); transform-origin: left center;
                transform: scaleX(0); z-index: 5; opacity: .9; }
  :root:not(.hjul-teljar) .hjul { visibility: hidden; }
  :root.hjul-teljar .nedteljing { display: none; }
  #hjul { stroke: var(--aksent); stroke-linecap: round; stroke-dasharray: 94.25px; stroke-dashoffset: 0px; }
</style>
<script src="tema.js"></script>
</head>
<body>
<div class="side">
  <section class="fare" id="fare" hidden>
    <div class="namn" id="fareNiva"></div>
    <div><b id="fareHovud"></b><span id="fareMeir"></span></div>
  </section>

  <div class="midt">
  <div class="klokkeblokk">
    <div class="klokke tal"><span id="tim">--</span><span class="kolon" id="kolon">:</span><span id="min">--</span></div>
    <div class="dato"><b id="dato"></b><span id="veke"></span></div>
  </div>

  <div class="rader">
    <section class="rad ope" id="ope">
      <div class="namn">Biblioteket</div>
      <div class="verdi"><span class="prikk"></span><span id="opeNo"></span><span class="under" id="opeMeir"></span></div>
    </section>

    <section class="rad skule" id="skule" hidden>
      <div class="namn">Skulen</div>
      <div class="verdi"><span id="skuleHovud"></span><span class="under" id="skuleMeir"></span></div>
    </section>

    <section class="rad" id="ver" hidden>
      <div class="namn">Vêret</div>
      <div class="verdi">
        <div class="vernu">
          <div class="grad tal" id="grad"></div>
          <svg id="vericon" viewBox="0 0 34 30" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg>
          <div class="skildring"><b id="vertekst"></b><span id="vind"></span></div>
        </div>
        <div class="timar" id="timar" hidden></div>
        <div class="verlinjer">
          <div id="vmVind" hidden><svg viewBox="0 0 24 24" fill="none" stroke="var(--aksent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g id="vindpil"><path d="M12 20V4M6 10l6-6 6 6"/></g></svg><span></span></div>
          <div id="vmSpenn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="var(--aksent)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14.5V4a2 2 0 1 1 4 0v10.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/></svg><span></span></div>
          <div id="vmNedbor" hidden><svg viewBox="0 0 24 24" fill="none" stroke="var(--aksent)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg><span></span></div>
          <div id="sol" hidden><svg viewBox="0 0 28 20" fill="none" stroke="var(--aksent)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 15a8 8 0 0 1 16 0"/><path d="M2 18h24"/><path d="M14 2v3M4.5 6l2 2M23.5 6l-2 2"/></svg><span id="soltekst"></span></div>
        </div>
        <div class="dagar" id="dagar" hidden></div>
      </div>
    </section>

    <section class="rad" id="ferje" hidden>
      <div class="namn">Ferja</div>
      <div class="verdi"><span class="tal" id="ferjetid"></span> <span class="aksent" id="ferjeom"></span><span class="under" id="ferjemerknad"></span></div>
    </section>

    <section class="rad" id="dag" hidden>
      <div class="namn">Dagen i dag</div>
      <div class="verdi"><span id="dagHovud"></span><span class="under" id="dagMeir"></span></div>
    </section>

    <section class="rad fodd" id="fodd" hidden>
      <div class="namn">Fødd i dag</div>
      <div class="verdi" id="foddListe"></div>
    </section>
  </div>
  <div class="punkt" id="punkt" aria-hidden="true"></div>
  </div>

  <footer>
    <div class="botnmerke">
      <span class="botnnamn"><b>Tysnes</b> folkebibliotek</span>
      <span class="kjelde" id="kjelde"></span>
    </div>
    <svg class="hjul" viewBox="0 0 36 36" aria-hidden="true"><circle class="spor" cx="18" cy="18" r="15"/><circle id="hjul" cx="18" cy="18" r="15"/></svg>
  </footer>
</div>
<div class="nedteljing" id="nedteljing" aria-hidden="true"></div>
<script>
// ---- Innstillingar ---------------------------------------------------------
const POS = { lat: 60.04, lon: 5.52 };                 // Våge, Tysnes kommune, Vestland (MET vil ha få desimalar)
const KLIENT = "tysnesfolkebibliotek-infoskjerm";      // identifikasjon hos Entur
const MOT = /halhjem/i;                                // berre avgangar mot Halhjem
const VER_KVAR_MS = 30 * 60e3, FERJE_KVAR_MS = 2 * 60e3;
const VER_GAMAL_MS = 3 * 3600e3;                       // eldre vêrdata enn dette blir ikkje viste

// Reserve om opningstider.json ikkje kan hentast. Dagane: søn=0 … lør=6.
let OPNING = {
  meirope: "08-22",
  betjent: { man: "09-15", tys: "09-15", ons: "09-15", tor: "12-18" },
  unntak: {}
};

const H = new URLSearchParams(location.hash.slice(1));
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2, "0");
const kl = d => p2(d.getHours()) + ":" + p2(d.getMinutes());
const DAGKODE = ["søn", "man", "tys", "ons", "tor", "fre", "lør"];
const DAGNAMN = ["Sundag", "Måndag", "Tysdag", "Onsdag", "Torsdag", "Fredag", "Laurdag"];
const MND = ["januar", "februar", "mars", "april", "mai", "juni", "juli", "august", "september", "oktober", "november", "desember"];
const isoDato = d => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());

// Variant og boksar (frå plakatbyggjaren). Vêrtavla viser alltid vêret.
const VARIANT = ["ver", "vertavle"].includes(H.get("variant")) ? H.get("variant") : "klokke";
document.documentElement.classList.add("v-" + VARIANT);
const UTAN = new Set((H.get("utan") || "").split(",").map(s => s.trim()).filter(Boolean));
const MED = k => !UTAN.has(k) || (k === "ver" && VARIANT === "vertavle");
const FODD = H.get("fodd") === "1";
// Skrift (#skrift=…): frå Google Fonts, som karusellane. Utan nett: standardskrifta (Ubuntu).
// Fargar (#farge=…): standard «petrol» (sand og petrol) heile døgnet. Med #tema=… blir
// eit tema frå tema.js brukt i staden; «farge=auto» gir det gamle (Lys om dagen, Kveld om kvelden).
const FARGE = H.get("farge") === "auto" ? "" : H.get("farge") || (H.get("tema") ? "" : "petrol");
const SKRIFTER = { inter: ["Inter", "Inter:wght@300;400;700"], poppins: ["Poppins", "Poppins:wght@300;400;700"],
                   lora: ["Lora", "Lora:wght@400;700"] };
const SKRIFT = H.get("skrift") || "poppins";   // «skrift=standard» gir Ubuntu
if (SKRIFTER[SKRIFT]) {
  const [namn, last] = SKRIFTER[SKRIFT];
  document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet", href: "https://fonts.googleapis.com/css2?family=" + last + "&display=swap" }));
  document.documentElement.style.setProperty("--skrift", `"${namn}", "Ubuntu", "DejaVu Sans", sans-serif`);
}
$("kjelde").textContent = [
  (MED("ver") || MED("sol") || MED("fare")) && "Vêr: MET Norge",
  MED("ferje") && "Ferje: Entur",
  FODD && "Fødd i dag: Wikidata",
  MED("dag") && "Dagen i dag: Wikipedia",
].filter(Boolean).join(" · ");

const minne = { les(k) { try { return JSON.parse(localStorage.getItem("klokke:" + k)); } catch (e) { return null; } },
                skriv(k, v) { try { localStorage.setItem("klokke:" + k, JSON.stringify(v)); } catch (e) {} } };

// «No», med moglegheit for å late som (tid=19:30, dag=lør) når ein testar.
function no() {
  const d = new Date();
  const t = (H.get("tid") || "").match(/^(\d{1,2})[:.](\d{2})$/);
  if (t) d.setHours(+t[1], +t[2]);
  const dag = DAGKODE.indexOf((H.get("dag") || "").toLowerCase());
  if (dag >= 0) d.setDate(d.getDate() + dag - d.getDay());
  return d;
}

// ---- Klokke og dato ----------------------------------------------------------
function veke(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
}
function teiknKlokke() {
  const d = no();
  $("tim").textContent = p2(d.getHours());
  $("min").textContent = p2(d.getMinutes());
  // Kolonet blinkar mjukt med sekunda: sterkt eitt sekund, svakt det neste
  $("kolon").classList.toggle("av", d.getSeconds() % 2 === 1);
  $("dato").textContent = DAGNAMN[d.getDay()] + " " + d.getDate() + ". " + MND[d.getMonth()];
  $("veke").textContent = "Veke " + veke(d);
}

// ---- Opningstid --------------------------------------------------------------
const spenn = s => { const m = String(s || "").match(/^(\d{1,2})(?:[:.](\d{2}))?\s*-\s*(\d{1,2})(?:[:.](\d{2}))?$/);
                     return m ? [+m[1] + (+m[2] || 0) / 60, +m[3] + (+m[4] || 0) / 60] : null; };
const klTal = h => p2(Math.floor(h)) + ":" + p2(Math.round((h % 1) * 60));
// Kort form til opningstida øvst: «15» for 15:00, «15:30» elles
const klKort = h => h % 1 ? klTal(h) : String(Math.floor(h));
function teiknOpning() {
  const d = no(), t = d.getHours() + d.getMinutes() / 60;
  const iso = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  const u = (OPNING.unntak || {})[iso] || {};
  // «meirope» er éi tid for alle dagar (opningstider.json) eller per dag (frå Bibliotek.no)
  const moFast = typeof OPNING.meirope === "object" ? (OPNING.meirope || {})[DAGKODE[d.getDay()]] : OPNING.meirope;
  const mo = spenn("meirope" in u ? u.meirope : moFast);
  const bt = spenn("betjent" in u ? u.betjent : (OPNING.betjent || {})[DAGKODE[d.getDay()]]);
  let klasse = "", hovud, meir;
  if (bt && t >= bt[0] && t < bt[1]) {
    klasse = "betjent"; hovud = "Betjent til " + klKort(bt[1]); meir = mo && mo[1] > bt[1] ? "Meirope til " + klKort(mo[1]) : "";
  } else if (mo && t >= mo[0] && t < mo[1]) {
    hovud = "Meirope til " + klKort(mo[1]); meir = bt && t < bt[0] ? "Betjent frå " + klKort(bt[0]) : "Med nasjonalt lånekort";
  } else {
    klasse = "stengt"; hovud = "Stengt"; meir = mo && t < mo[0] ? "Opnar kl. " + klKort(mo[0]) : "";
  }
  if (u.tekst) meir += (meir ? " · " : "") + u.tekst;
  $("ope").classList.remove("betjent", "stengt");
  if (klasse) $("ope").classList.add(klasse);
  $("ope").hidden = !MED("ope");
  $("opeNo").textContent = hovud;
  $("opeMeir").textContent = meir;
}
// Opningstidene kjem frå Bibliotek.no (same som på tysnesbibliotek.no), så dei berre
// treng å endrast éin stad. Rekkjefølgje: 1) opningstider.json (reserve + skuletimar),
// 2) Bibliotek.no oppå, eller sist henta svar frå Bibliotek.no om nettsida ikkje svarar.
const BIBNO = "https://www.tysnesbibliotek.no/api/v1/libraries";
const BIBNO_HOVUD = { "Client-Identifier": "Tysnes folkebibliotek infoskjerm (biblioteket@tysnes.kommune.no)" };
const BIBNO_DAG = { monday: "man", tuesday: "tys", wednesday: "ons", thursday: "tor", friday: "fre", saturday: "lør", sunday: "søn" };
// Éin dag frå API-et ({ isClosedAllDay, periods: [{ opens, closes }] }) → «09:00-15:00», "" når stengt
function bibnoDag(o) {
  const p = (o && !o.isClosedAllDay && o.periods) || [];
  return p.length ? p[0].opens + "-" + p[p.length - 1].closes : "";
}
// Avvik (specialOpeningHours) → «unntak» per dato. Formatet er ikkje dokumentert i detalj,
// så her blir dei vanlegaste feltnamna prøvde; ukjende oppføringar blir hoppa over.
function bibnoUnntak(liste) {
  const ut = {};
  for (const s of liste || []) {
    const fra = s.date || s.startDate || s.from || s.fromDate;
    if (!/^\d{4}-\d{2}-\d{2}/.test(fra || "")) continue;
    const til = s.endDate || s.to || s.toDate || fra;
    const e = {};
    if (s.regular) e.betjent = bibnoDag(s.regular);
    if (s.selfService) e.meirope = bibnoDag(s.selfService);
    if (!s.regular && !s.selfService && ("isClosedAllDay" in s || s.periods)) { e.betjent = bibnoDag(s); e.meirope = bibnoDag(s); }
    const tekst = [s.note, s.description, s.label, s.title, s.name].find(x => typeof x === "string" && x);
    if (tekst) e.tekst = tekst;
    const d = new Date(fra.slice(0, 10) + "T12:00:00"), slutt = new Date(til.slice(0, 10) + "T12:00:00");
    for (let n = 0; d <= slutt && n < 62; n++, d.setDate(d.getDate() + 1)) ut[isoDato(d)] = e;
  }
  return ut;
}
function fraBibno(b) {
  const betjent = {}, meirope = {};
  for (const [en, nn] of Object.entries(BIBNO_DAG)) {
    const dag = b.openingHours[en] || {};
    betjent[nn] = bibnoDag(dag.regular);
    meirope[nn] = b.hasSelfService === false ? "" : bibnoDag(dag.selfService);
  }
  return { betjent, meirope, unntak: Object.assign({}, OPNING.unntak, bibnoUnntak(b.specialOpeningHours)) };
}
async function hentOpning() {
  const fil = await fetch("opningstider.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  if (fil && fil.meirope) { OPNING = fil; minne.skriv("opning", fil); }
  else { const j = minne.les("opning"); if (j) OPNING = j; }
  let b = await fetch(BIBNO, { headers: BIBNO_HOVUD, cache: "no-cache" }).then(r => r.ok ? r.json() : null)
    .then(j => j && ((j.data || []).find(x => /tysnes/i.test(x.name)) || (j.data || [])[0])).catch(() => null);
  if (b && b.openingHours) minne.skriv("bibno", b); else b = minne.les("bibno");
  if (b && b.openingHours) OPNING = Object.assign({}, OPNING, fraBibno(b));
  teiknOpning();
}
hentOpning();
setInterval(hentOpning, 3600e3);

// ---- Skuletimar og friminutt --------------------------------------------------
// Frå «skule» i opningstider.json: skuledagar og timeplanen. Ingenting å halde
// ved like kvart år: raude dagar og sommarferien (20. juni–15. august) blir
// rekna ut her. I haust-, vinter- og juleferie står boksen som vanleg – då er
// det ingen elevar som les han. «fri» i fila kan brukast til ekstra fridagar.
const SKULE_RESERVE = { dagar: ["man", "tys", "ons", "tor", "fre"], kortdag: ["fre"],
  timar: ["08.05-08.50", "08.50-09.35", "09.45-10.30", "11.05-11.50", "12.05-12.50", "13.00-13.45"], fri: [] };
const SOMMARFERIE = ["06-20", "08-15"];   // MM-DD, begge dagar med
const omMin = m => m < 60 ? "om " + Math.max(1, m) + " min" : "om " + Math.floor(m / 60) + " t" + (m % 60 ? " " + (m % 60) + " min" : "");
// Raude dagar i Noreg (påske etter Gauss/Meeus-algoritmen)
function raudeDagar(år) {
  const a = år % 19, b = Math.floor(år / 100), c = år % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
        g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
        l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
        mnd = Math.floor((h + l - 7 * m + 114) / 31), dag = ((h + l - 7 * m + 114) % 31) + 1;
  const påske = new Date(år, mnd - 1, dag);
  const iso = d0 => d0.getFullYear() + "-" + p2(d0.getMonth() + 1) + "-" + p2(d0.getDate());
  const frå = n => { const x = new Date(påske); x.setDate(x.getDate() + n); return iso(x); };
  return [`${år}-01-01`, frå(-3), frå(-2), frå(1), `${år}-05-01`, `${år}-05-17`, frå(39), frå(50), `${år}-12-25`, `${år}-12-26`];
}
function teiknSkule() {
  const S = OPNING.skule || SKULE_RESERVE, d = no();
  const iso = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
  const md = iso.slice(5);
  const fri = raudeDagar(d.getFullYear()).includes(iso) || (md >= SOMMARFERIE[0] && md <= SOMMARFERIE[1])
           || (S.fri || []).some(f => { const [a, b] = String(f).split("/"); return iso >= a && iso <= (b || a); });
  const timar = (S.timar || []).map(spenn).filter(Boolean).map(([a, b]) => [a * 60, b * 60]);   // minutt etter midnatt
  const t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const vis = MED("skule") && !fri && timar.length && (S.dagar || []).includes(DAGKODE[d.getDay()]) && t >= timar[0][0] - 15 && t < timar[timar.length - 1][1];
  $("skule").hidden = !vis;
  if (!vis) return;
  const klm = m => klTal(m / 60), att = m => Math.ceil(m - t);
  let hovud, meir, friminutt = false;
  const i = timar.findIndex(([a, b]) => t >= a && t < b);
  if (t < timar[0][0]) {
    hovud = "Skulen byrjar " + omMin(att(timar[0][0])); meir = "Første time kl. " + klm(timar[0][0]);
  } else if (i >= 0) {
    // Neste friminutt: første time frå no som ikkje går rett over i ein ny
    let j = i;
    while (timar[j + 1] && timar[j + 1][0] <= timar[j][1]) j++;
    const slutt = timar[j][1], etter = timar[j + 1];
    // Dagar der nokre trinn sluttar tidlegare («kortdag»): ikkje skriv at skulen sluttar
    const kort = (S.kortdag || []).includes(DAGKODE[d.getDay()]);
    if (!etter) { hovud = (kort ? "Timen sluttar " : "Skulen sluttar ") + omMin(att(slutt)); meir = "Siste time sluttar kl. " + klm(slutt); }
    else { hovud = "Friminutt " + omMin(att(slutt)); meir = "Friminutt kl. " + klm(slutt) + "–" + klm(etter[0]); }
    if (j > i) meir = "Timeskifte kl. " + klm(timar[i][1]) + " · " + meir.charAt(0).toLowerCase() + meir.slice(1);
  } else {
    const neste = timar.find(([a]) => a > t);
    friminutt = true; hovud = "Friminutt no"; meir = "Ny time kl. " + klm(neste[0]) + " – " + omMin(att(neste[0]));
  }
  $("skule").classList.toggle("fri", friminutt);
  $("skuleHovud").textContent = hovud;
  $("skuleMeir").textContent = meir;
}

// ---- Vêr og sol (MET Norge) ---------------------------------------------------
// MET godtek kall frå nettlesaren når Origin-headeren har domenet til sida
// (tysnesfolkebibliotek.github.io). Nettlesaren lagrar svara etter Expires.
const VERORD = { clearsky: "Klårt", fair: "Lettskya", partlycloudy: "Delvis skya", cloudy: "Skya", fog: "Tåke",
  rain: "Regn", rainshowers: "Regnbyer", sleet: "Sludd", sleetshowers: "Sluddbyer", snow: "Snø", snowshowers: "Snøbyer" };
function verTekst(kode) {
  const k = String(kode).replace(/_(day|night|polartwilight)$/, "");
  const torden = k.endsWith("andthunder"), grunn = k.replace("andthunder", "");
  // MET skriv nokre kodar med «lights» (t.d. lightssleetshowers)
  const lett = /^lights?/.test(grunn), kraftig = grunn.startsWith("heavy");
  let ord = VERORD[grunn.replace(/^(lights?|heavy)/, "")] || "";
  if (ord && (lett || kraftig)) {
    const byer = /byer$/.test(ord);
    ord = (lett ? (byer ? "Lette " : "Lett ") : (byer ? "Kraftige " : "Kraftig ")) + ord.toLowerCase();
  }
  return ord + (ord && torden ? " og torden" : "");
}
// Små strekikon (same stil som resten av sida)
const SKY = '<path d="M9 19h16a6 6 0 0 0 0-12 8 8 0 0 0-15.3 2.5A5 5 0 0 0 9 19z" stroke="currentColor"/>';
const IKON = {
  sol: '<circle cx="17" cy="15" r="6" stroke="var(--aksent)"/><path d="M17 3v3M17 24v3M5 15h3M26 15h3M8.5 6.5l2 2M23.5 21.5l2 2M8.5 23.5l2-2M23.5 8.5l2-2" stroke="var(--aksent)"/>',
  mane: '<path d="M21 4a11 11 0 1 0 9 15A9 9 0 0 1 21 4z" stroke="currentColor"/>',
  lettskya: '<circle cx="11" cy="10" r="5" stroke="var(--aksent)"/><path d="M11 1.5v2M2.5 10h2M5 4l1.4 1.4M17 4l-1.4 1.4" stroke="var(--aksent)"/><path d="M12 25h13a5 5 0 0 0 0-10 6.5 6.5 0 0 0-12.4 2A4 4 0 0 0 12 25z" stroke="currentColor"/>',
  skya: SKY,
  regn: SKY + '<path d="M11 23l-1.5 4M17 23l-1.5 4M23 23l-1.5 4" stroke="var(--aksent)"/>',
  sno: SKY + '<path d="M11 24v3M9.5 25.5h3M17 24v3M15.5 25.5h3M23 24v3M21.5 25.5h3" stroke="var(--aksent)"/>',
  sludd: SKY + '<path d="M11 23l-1.5 4M23 23l-1.5 4" stroke="var(--aksent)"/><path d="M17 24v3M15.5 25.5h3" stroke="var(--aksent)"/>',
  torden: SKY + '<path d="M18 20l-3 5h4l-3 5" stroke="var(--aksent)"/>',
  take: '<path d="M4 9h26M7 15h22M4 21h26M9 27h18" stroke="currentColor"/>'
};
function verIkon(kode) {
  const k = String(kode), natt = /_night$/.test(k), g = k.replace(/_(day|night|polartwilight)$/, "");
  if (/thunder/.test(g)) return IKON.torden;
  if (/sleet/.test(g)) return IKON.sludd;
  if (/snow/.test(g)) return IKON.sno;
  if (/rain/.test(g)) return IKON.regn;
  if (g === "fog") return IKON.take;
  if (g === "cloudy") return IKON.skya;
  if (g === "clearsky") return natt ? IKON.mane : IKON.sol;
  return natt ? IKON.skya : IKON.lettskya;   // fair, partlycloudy
}
const VINDRETNING = ["nord", "nordaust", "aust", "søraust", "sør", "sørvest", "vest", "nordvest"];

let VER = minne.les("ver"), SOL = minne.les("sol"), FARE = minne.les("fare");
async function hentVer() {
  try {
    const r = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${POS.lat}&lon=${POS.lon}`);
    if (!r.ok) throw new Error("MET " + r.status);
    const j = await r.json();
    // Timeverdiar for dei neste 2–3 døgna (til vêrtavla og høgast/lågast i morgon)
    VER = { henta: Date.now(), serie: j.properties.timeseries.slice(0, 60).map(t => {
      const i = t.data.instant.details, n1 = t.data.next_1_hours, n6 = t.data.next_6_hours;
      return { tid: t.time, temp: i.air_temperature, vind: i.wind_speed, retning: i.wind_from_direction,
               kode: (n1 || n6 || {}).summary?.symbol_code, kode6: n6?.summary?.symbol_code,
               nedbor: n1?.details?.precipitation_amount ?? null };
    }) };
    minne.skriv("ver", VER);
  } catch (e) { console.warn("Fekk ikkje henta vêret:", e.message); }
  try {
    const d = new Date(), dato = isoDato(d);
    // Soltidene for i dag og i morgon (i morgon til «Sola går opp … i morgon» om kvelden)
    if (!SOL || SOL.dato !== dato || !("oppImorgon" in SOL)) {
      const hentSol = async dag => {
        const off = -dag.getTimezoneOffset(), offset = (off < 0 ? "-" : "+") + p2(Math.floor(Math.abs(off) / 60)) + ":" + p2(Math.abs(off) % 60);
        const r = await fetch(`https://api.met.no/weatherapi/sunrise/3.0/sun?lat=${POS.lat}&lon=${POS.lon}&date=${isoDato(dag)}&offset=${encodeURIComponent(offset)}`);
        if (!r.ok) throw new Error("MET sol " + r.status);
        return (await r.json()).properties;
      };
      const idag = await hentSol(d);
      let imorgon = null;
      try { imorgon = await hentSol(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 12)); } catch (e) {}
      SOL = { dato, opp: idag.sunrise?.time, ned: idag.sunset?.time, oppImorgon: imorgon?.sunrise?.time || null };
      minne.skriv("sol", SOL);
    }
  } catch (e) { console.warn("Fekk ikkje henta soltidene:", e.message); }
  if (MED("fare")) try {
    // Farevarsel som gjeld punktet vårt (MetAlerts). Tom liste = ingen farevarsel.
    const r = await fetch(`https://api.met.no/weatherapi/metalerts/2.0/current.json?lat=${POS.lat}&lon=${POS.lon}&lang=no`);
    if (!r.ok) throw new Error("MET farevarsel " + r.status);
    const j = await r.json();
    FARE = { henta: Date.now(), varsel: (j.features || []).map(f => {
      const p = f.properties || {}, iv = (f.when && f.when.interval) || [];
      const farge = String(p.awareness_level || p.riskMatrixColor || "").toLowerCase();
      const nivå = /red/.test(farge) ? 4 : /orange/.test(farge) ? 3 : /yellow/.test(farge) ? 2 : 0;
      return { nivå, namn: p.eventAwarenessName || p.event || "", frå: iv[0] || null, til: iv[1] || p.eventEndingTime || null };
    }).filter(v => v.nivå >= 2) };
    minne.skriv("fare", FARE);
  } catch (e) { console.warn("Fekk ikkje henta farevarsel:", e.message); }
  teiknVer(); tilpass();
}

// «kl. 14:00», «i morgon kl. 06:00» eller «torsdag kl. 18:00»
function dagOgKl(d) {
  const i = no(), dagar = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(i.getFullYear(), i.getMonth(), i.getDate())) / 864e5);
  return (dagar === 0 ? "" : dagar === 1 ? "i morgon " : DAGNAMN[d.getDay()].toLowerCase() + " ") + "kl. " + kl(d);
}
function teiknFare() {
  const nu = Date.now();
  const gjeld = MED("fare") && FARE && nu - FARE.henta < VER_GAMAL_MS
    ? FARE.varsel.filter(v => !v.til || new Date(v.til).getTime() > nu) : [];
  // Høgaste nivå først, så det som kjem først
  const v = gjeld.sort((a, b) => b.nivå - a.nivå || String(a.frå).localeCompare(String(b.frå)))[0];
  $("fare").hidden = !v;

  $("fareNiva").textContent = farge + " farevarsel";
  $("fareHovud").textContent = v.namn ? v.namn.charAt(0).toUpperCase() + v.namn.slice(1).toLowerCase() : farge + " farevarsel";
  const frå = v.frå && new Date(v.frå), til = v.til && new Date(v.til);
  const tilTekst = til && frå && isoDato(til) === isoDato(frå) ? "kl. " + kl(til) : til && dagOgKl(til);
  $("fareMeir").textContent = (frå && frå > nu ? "Frå " + dagOgKl(frå) + (til ? " til " + tilTekst.replace(/^kl\. /, "") : "") : til ? "Til " + dagOgKl(til) : "")
    + (gjeld.length > 1 ? " · " + (gjeld.length - 1) + " varsel til" : "");
}

// Kjennest som (vindavkjøling): berre når det er kaldt og blåser
function kjennestSom(t, vind) {
  const v = vind * 3.6;
  if (t > 10 || v < 4.8) return null;
  return Math.round(13.12 + 0.6215 * t - 11.37 * v ** 0.16 + 0.3965 * t * v ** 0.16);
}
const mm = x => String(Math.round(x * 10) / 10).replace(".", ",");
// «1,2 mm neste time · opphald frå kl. 19:00», «Regn frå kl. 21:00» eller «Opphald dei neste timane»
function nedborTekst(serie, d) {
  const timar = serie.filter(t => t.nedbor != null && new Date(t.tid) > new Date(d.getTime() - 60 * 60e3)).slice(0, 13);
  if (!timar.length) return "";
  const vått = t => t.nedbor >= 0.1;
  const type = t => /snow/.test(t.kode) ? "Snø" : /sleet/.test(t.kode) ? "Sludd" : "Regn";
  if (vått(timar[0])) {
    const opp = timar.find(t => !vått(t));
    return mm(timar[0].nedbor) + " mm neste time" + (opp ? " · opphald frå kl. " + kl(new Date(opp.tid)) : "");
  }
  const kjem = timar.find(t => t.nedbor >= 0.2);
  return kjem ? type(kjem) + " frå kl. " + kl(new Date(kjem.tid)) : "Opphald dei neste timane";
}
// Høgast/lågast for eit døgn, med symbolet midt på dagen
function dagSpenn(serie, dag) {
  const iso = isoDato(dag), l = serie.filter(t => isoDato(new Date(t.tid)) === iso);
  if (l.length < 3) return null;
  const temp = l.map(t => t.temp), midt = l.find(t => new Date(t.tid).getHours() >= 12) || l[l.length - 1];
  return { min: Math.round(Math.min(...temp)), max: Math.round(Math.max(...temp)), kode: midt.kode6 || midt.kode };
}

function teiknVer() {
  const d = new Date();
  // Bruk timen som gjeld no (MET gir ein serie frå no og framover)
  const fersk = VER && Date.now() - VER.henta < VER_GAMAL_MS;
  const nu = fersk && VER.serie.filter(t => new Date(t.tid) <= new Date(d.getTime() + 30 * 60e3)).pop();
  $("ver").hidden = !MED("ver") || !nu || !nu.kode;
  if (nu && nu.kode) {
    $("vericon").innerHTML = verIkon(nu.kode);
    $("grad").textContent = Math.round(nu.temp) + "°";
    $("vertekst").textContent = verTekst(nu.kode);
    const v = Math.round(nu.vind);
    const vindTekst = (v >= 4 && nu.retning != null ? v + " m/s frå " + VINDRETNING[Math.round(nu.retning / 45) % 8] : v >= 1 ? v + " m/s" : "Stille");
    const ks = kjennestSom(nu.temp, nu.vind);
    if (VARIANT === "klokke") $("vind").textContent = "Vind " + vindTekst.replace("Stille", "0 m/s");
    else $("vind").textContent = ks != null && Math.abs(ks - nu.temp) >= 2 ? "Kjennest som " + ks + "°" : "";
    // Meir vêr: vind med pil, nedbør og (i variant=ver) høgast/lågast
    for (const id of ["vmVind", "vmNedbor"]) $(id).hidden = VARIANT === "klokke";
    if (VARIANT !== "klokke") {
      $("vmVind").querySelector("span").innerHTML = v >= 1 ? `Vind <b>${vindTekst}</b>` : "<b>Stille</b>";
      $("vindpil").setAttribute("transform", `rotate(${((nu.retning || 0) + 180) % 360} 12 12)`);
      $("vindpil").style.visibility = v >= 1 && nu.retning != null ? "" : "hidden";
      const ned = nedborTekst(VER.serie, d);
      $("vmNedbor").hidden = !ned;
      $("vmNedbor").querySelector("span").textContent = ned;
      // I dag fram til kl. 15 (om det er att nok av dagen), elles i morgon
      const idag = d.getHours() < 15 && dagSpenn(VER.serie, d), imorgon = dagSpenn(VER.serie, new Date(d.getTime() + 864e5));
      const sp = idag || imorgon;
      $("vmSpenn").hidden = VARIANT !== "ver" || !sp;
      if (sp) $("vmSpenn").querySelector("span").innerHTML = `${idag ? "I dag" : "I morgon"} <b>${sp.min}° til ${sp.max}°</b>`;
    }
    // Vêrtavla: dei neste 6 timane, og i dag / i morgon
    $("timar").hidden = $("dagar").hidden = VARIANT !== "vertavle";
    if (VARIANT === "vertavle") {
      const neste = VER.serie.filter(t => new Date(t.tid) > d && t.nedbor != null).slice(0, 6);
      $("timar").innerHTML = neste.map(t => `<div><span>${p2(new Date(t.tid).getHours())}</span>`
        + `<svg viewBox="0 0 34 30" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${verIkon(t.kode)}</svg>`
        + `<b>${Math.round(t.temp)}°</b></div>`).join("");
      $("timar").hidden = !neste.length;
      // I dag og i morgon; etter kl. 15 i morgon og dagen etter
      const dag = n => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12);
      const dagar = (d.getHours() < 15 ? [["I dag", dag(0)], ["I morgon", dag(1)]] : [["I morgon", dag(1)], [DAGNAMN[dag(2).getDay()], dag(2)]])
        .map(([namn, x]) => [namn, dagSpenn(VER.serie, x)]).filter(x => x[1]);
      $("dagar").innerHTML = dagar.map(([namn, s]) => `<div><svg viewBox="0 0 34 30" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">`
        + `${verIkon(String(s.kode).replace(/_night$/, "_day"))}</svg><div><span>${namn}</span><b>${s.min}° / ${s.max}°</b></div></div>`).join("");
      $("dagar").hidden = !dagar.length;
    }
  }
  const idag = SOL && SOL.dato === isoDato(d);
  const opp = idag && SOL.opp && new Date(SOL.opp), ned = idag && SOL.ned && new Date(SOL.ned);
  $("sol").hidden = !MED("sol") || !(opp && ned);   // sola står i vêrkortet
  if (opp && ned) {
    const t = no();
    const oppIm = SOL.oppImorgon && new Date(SOL.oppImorgon);
    $("soltekst").innerHTML = t < opp ? `Sola går opp <b>${kl(opp)}</b>` : t < ned ? `Sola går ned <b>${kl(ned)}</b>`
      : oppIm ? `Sola går opp <b>${kl(oppIm)}</b> i morgon` : `Sola gjekk ned ${kl(ned)}`;
  }
  teiknFare();
  // Mørke fargar når sola er nede (eller kveld=1/0 i lenkja)
  const t = no();
  const kveld = H.has("kveld") ? H.get("kveld") === "1" : (opp && ned ? (t < opp || t >= ned) : (t.getHours() < 8 || t.getHours() >= 16));
  // Tema som på karusellane: «Kveld» (standardfargane) etter solnedgang, «Lys» om dagen
  // Eigne klokkefargar (#farge=…) gjeld heile døgnet; då blir ikkje tema frå tema.js brukt
  const farge = FARGE;
  if (farge) { document.documentElement.dataset.farge = farge; delete document.documentElement.dataset.tema; return; }
  const tema = H.get("tema") || (kveld ? "kveld" : "lys");
  if (tema === "kveld" || typeof TEMA_ETTER_ID === "undefined" || !TEMA_ETTER_ID[tema]) delete document.documentElement.dataset.tema;
  else document.documentElement.dataset.tema = tema;
}

// ---- Ferje (Entur) ------------------------------------------------------------
// Våge kai (NSR:StopPlace:58466) er éin stoppestad for buss, hurtigbåt og ferje.
// Vi tek berre med ferjer mot Halhjem. Avgangane blir lagra med klokkeslett,
// så sida kan vise neste ferje sjølv om nettet er borte ei stund.
const STOPP = "NSR:StopPlace:58466";
let AVGANGAR = minne.les("avgangar") || [];
async function hentFerje() {
  if (!MED("ferje")) return;
  try {
    const q = `{ stopPlace(id: "${STOPP}") { estimatedCalls(numberOfDepartures: 60, timeRange: 172800) {
      expectedDepartureTime aimedDepartureTime cancellation forBoarding
      destinationDisplay { frontText } serviceJourney { line { transportMode } } } } }`;
    const r = await fetch("https://api.entur.io/journey-planner/v3/graphql", {
      method: "POST", headers: { "Content-Type": "application/json", "ET-Client-Name": KLIENT }, body: JSON.stringify({ query: q }) });
    if (!r.ok) throw new Error("Entur " + r.status);
    const j = await r.json();
    if (!j.data || !j.data.stopPlace) throw new Error("ukjend stopp " + STOPP);
    AVGANGAR = j.data.stopPlace.estimatedCalls
      .filter(c => c.forBoarding !== false && MOT.test(c.destinationDisplay?.frontText || "") && c.serviceJourney?.line?.transportMode === "water")
      .map(c => ({ venta: c.expectedDepartureTime, rute: c.aimedDepartureTime, innstilt: !!c.cancellation }));
    minne.skriv("avgangar", AVGANGAR);
  } catch (e) { console.warn("Fekk ikkje henta ferja:", e.message); }
  teiknFerje(); tilpass();
}
function omTid(min) {
  if (min < 1) return "går no";
  if (min < 60) return "om " + min + " min";
  const t = Math.floor(min / 60), m = min % 60;
  return "om " + t + " t" + (m ? " " + m + " min" : "");
}
function teiknFerje() {
  const nu = Date.now();
  // Ferja er farten når ho har gått; vis neste som ikkje er innstilt
  const kom = AVGANGAR.filter(a => new Date(a.venta).getTime() > nu - 30e3);
  const neste = kom.find(a => !a.innstilt);
  $("ferje").hidden = !MED("ferje") || !neste || new Date(neste.venta) - nu > 12 * 3600e3;
  if (!neste) return;
  const venta = new Date(neste.venta), rute = new Date(neste.rute);
  $("ferjetid").textContent = kl(venta);
  $("ferjeom").textContent = omTid(Math.floor((venta - nu) / 60e3));
  const forsein = Math.round((venta - rute) / 60e3);
  const innstilt = kom.indexOf(neste) > 0 && kom[0].innstilt;
  $("ferjemerknad").textContent = innstilt ? `Ferja kl. ${kl(new Date(kom[0].rute))} er innstilt`
                                : forsein >= 3 ? `Forseinka – etter ruta kl. ${kl(rute)}` : "Våge → Halhjem";
}

// ---- Fødd i dag (Wikidata + Bibliofil) ----------------------------------------
// Forfattarar fødde på dagens dato som har ein artikkel på norsk Wikipedia.
// Så sjekkar vi i Bibliofil kven av dei biblioteket har bøker av, og viser berre dei.
// Norske og nordiske forfattarar kjem først, så dei mest kjende (flest Wikipedia-artiklar).
// Blir henta éin gong per døgn. Kjem sida fram fleire gonger, blir det neste namnet vist.
const SERVER = "https://strdbib.bib.no", AVDAR = ["tyfv", "tyfb"];
let FØDD = minne.les("fodd"), foddNr = 0;
const ordAv = t => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[^a-z0-9æøð]+/).filter(Boolean);

// SRU med JSONP, som i karusellane (index.html). Svaret kjem alltid til «callback», så éin om gongen.
function jsonp(url, ms) {
  return new Promise((ok, feil) => {
    const s = document.createElement("script");
    let ferdig = false;
    const slutt = (fn, v) => { if (ferdig) return; ferdig = true; clearTimeout(t); s.remove(); window.callback = () => {}; fn(v); };
    const t = setTimeout(() => slutt(feil, new Error("Bibliofil svarte ikkje i tide")), ms);
    window.callback = d => slutt(ok, d);
    s.onerror = () => slutt(feil, new Error("Fekk ikkje kontakt med Bibliofil"));
    s.src = url;
    document.head.append(s);
  });
}
const sru = (q, maks = 100, frå = 1) => jsonp(SERVER + "/cgi-bin/sru?" + Object.entries({ operation: "searchRetrieve", recordSchema: "bsdc", responseType: "text/javascript",
  query: q, startRecord: frå, maximumRecords: maks }).map(([k, v]) => k + "=" + encodeURIComponent(String(v)).replace(/%3A/gi, ":")).join("&"), 45000);
const avdFilter = "(" + AVDAR.map(a => `bibliofil.ccl="avd=${a}"`).join(" or ") + ")";
// Same forfattarindeksar som Nobel-malen prøver (index.html)
const INDEKSAR = [w => `bibliofil.ccl="fo=${w}"`, w => `dc.creator="${w}"`];
async function finnIndeks() {
  for (const ix of INDEKSAR) {
    try { const d = await sru(`${ix("hamsun")} and norzig.materialType=l`);
          if (Number(d?.feed?.sru_numberOfRecords || 0) > 0) return ix; } catch (e) {}
  }
  return INDEKSAR[0];
}
// Tal titlar biblioteket har av kvar forfattar. Fleire forfattarar i eitt søk
// (fo=fosse or fo=turgenjev or …), som Nobel-malen i index.html, så det går fort.
// Gir ein Map namn → tal titlar. Kastar feil om Bibliofil ikkje svarar.
async function talBøker(kandidatar, ix) {
  const k = kandidatar.map(x => { const o = ordAv(x.namn); return { namn: x.namn, før: o[0], etter: o[o.length - 1], ok: o.length >= 2 }; })
    .filter(x => x.ok);
  const etternamn = [...new Set(k.map(x => x.etter))];
  const titlar = new Map(k.map(x => [x.namn, new Set()]));
  if (!etternamn.length) return new Map();
  // Bibliofil gir høgst 500 treff per side. Vanlege etternamn (Hansen, Larsen …) kan fylle
  // opp sida, så vi hentar fleire sider om det trengst (høgst 4, som Nobel-malen).
  const q = `(${etternamn.map(ix).join(" or ")}) and ${avdFilter} and norzig.materialType=l`;
  const poster = [];
  for (let side = 0; side < 4; side++) {
    const d = await sru(q, 500, side * 500 + 1);
    poster.push(...(d?.feed?.entry || []));
    if ((side + 1) * 500 >= Number(d?.feed?.sru_numberOfRecords || 0)) break;
  }
  for (const p of poster) {
    const r = p.sru_recordData || {};
    const forf = [].concat(r.bsdc_creator || []).map(c => ordAv((c && c.name) || c));
    const tittel = ordAv([].concat(r.bsdc_title || "")[0]).join(" ");
    // Både fornamn og etternamn må stå i forfattarnamnet (ikkje bøker OM forfattaren)
    for (const x of k) if (forf.some(f => f.includes(x.etter) && f.includes(x.før))) titlar.get(x.namn).add(tittel);
  }
  return new Map([...titlar].map(([n, t]) => [n, t.size]));
}
// ---- Dagen i dag (nynorsk Wikipedia) ------------------------------------------
// Same innhald som boksen «Dagen i dag» på framsida av nn.wikipedia.org: namnedag og
// nasjonaldagar. Framsida ligg ofte i mellomlageret med gamal dato, så vi ber API-et
// lage ho på nytt («{{:Hovudside}}») og plukkar ut punkta i boksen. Éin gong per døgn.
let DAG = minne.les("dag");
async function hentDag() {
  if (!MED("dag")) return;
  const dato = isoDato(new Date());
  if (DAG && DAG.dato === dato) return teiknDag();
  try {
    const url = "https://nn.wikipedia.org/w/api.php?" + new URLSearchParams({ action: "parse", format: "json", formatversion: "2",
      origin: "*", prop: "text", disablelimitreport: "1", contentmodel: "wikitext", title: "Hovudside", text: "{{:Hovudside}}" });
    const r = await fetch(url);
    if (!r.ok) throw new Error("Wikipedia " + r.status);
    const html = (await r.json())?.parse?.text;
    if (!html) throw new Error("tomt svar");
    const doc = new DOMParser().parseFromString(html, "text/html");
    // Overskrifta «Dagen i dag», så den næraste boksen rundt ho som har punkt (li)
    const overskrift = [...doc.querySelectorAll("h1,h2,h3,h4,div,span,b,th,p")]
      .find(e => e.children.length <= 2 && /^\s*Dagen i dag\s*$/i.test(e.textContent));
    let boks = overskrift;
    while (boks && !boks.querySelector("li")) boks = boks.parentElement;
    const punkt = boks ? [...boks.querySelectorAll("li")].map(l => l.textContent.replace(/\s+/g, " ").trim())
      .filter(t => t && !/^ingen /i.test(t)) : [];
    if (!punkt.length || punkt.length > 8) throw new Error("fann ikkje boksen «Dagen i dag»");
    DAG = { dato, punkt };
    minne.skriv("dag", DAG);
  } catch (e) { console.warn("Fekk ikkje henta Dagen i dag:", e.message); }
  teiknDag(); tilpass();
}
// «Tordis og Teodor har namnedag» → «Tordis og Teodor» stort, «har namnedag» under
function teiknDag() {
  const punkt = MED("dag") && DAG && DAG.dato === isoDato(new Date()) ? DAG.punkt : [];
  $("dag").hidden = !punkt.length;
  if (!punkt.length) return;
  // Éi setning: namna utheva, «har namnedag» i vanleg skrift. Resten (nasjonaldagar) under.
  const m = punkt[0].match(/^(.*?)\s+(har namnedag.*)$/i);
  const namn = document.createElement("b"), rest = document.createElement("span");
  namn.textContent = m ? m[1] : punkt[0];
  rest.className = "lett"; rest.textContent = m ? " " + m[2] : "";
  $("dagHovud").replaceChildren(namn, rest);
  $("dagMeir").textContent = punkt.slice(1).join("\n");
}

async function hentFødd() {
  if (!FODD) return;
  const d = new Date(), dato = isoDato(d);
  if (FØDD && FØDD.dato === dato) return teiknFødd();
  try {
    // Yrke: forfattar, romanforfattar, poet, barnebokforfattar, dramatikar, forfattar (author), essayist,
    // novelleforfattar, sci-fi-forfattar, omsetjar, journalist, historikar, teikneserieskapar, illustratør.
    // Spørjinga må vere rask: Wikidata avbryt etter 60 sekund, og då kjem eit svar utan
    // CORS-hovud, som nettlesaren berre kallar «NetworkError». Å gå gjennom alle forfattarar
    // og sjekke fødselsdagen tok for lang tid. I staden listar vi opp dagens dato for kvart
    // år frå 1600 (1818-11-09, 1819-11-09 …) og slår opp kven som er fødde akkurat då. Det er
    // eit raskt oppslag. optimizer "None" gjer at linjene blir køyrde i den rekkjefølgja dei står.
    // Fødselsdatoar med berre årstal står som 1. januar i Wikidata, så 1.1. blir hoppa over.
    if (d.getMonth() === 0 && d.getDate() === 1) throw new Error("1. januar blir hoppa over");
    const md = p2(d.getMonth() + 1) + "-" + p2(d.getDate());
    const datoar = [];
    for (let år = 1600; år <= d.getFullYear() - 10; år++) datoar.push(`"${år}-${md}T00:00:00Z"^^xsd:dateTime`);
    const q = `SELECT DISTINCT ?p ?pLabel ?pDescription ?aar ?sl ?land WHERE {
      hint:Query hint:optimizer "None" .
      VALUES ?f { ${datoar.join(" ")} }
      ?p wdt:P569 ?f .
      VALUES ?yrke { wd:Q36180 wd:Q6625963 wd:Q49757 wd:Q4853732 wd:Q214917 wd:Q482980 wd:Q11774202 wd:Q15949613
                     wd:Q18844224 wd:Q333634 wd:Q1930187 wd:Q201788 wd:Q715301 wd:Q644687 }
      ?p wdt:P106 ?yrke .
      VALUES ?wiki { <https://no.wikipedia.org/> <https://nn.wikipedia.org/> }
      ?a schema:about ?p ; schema:isPartOf ?wiki .
      ?p wikibase:sitelinks ?sl .
      BIND(YEAR(?f) AS ?aar)
      # Nordisk statsborgarskap (Noreg, Sverige, Danmark, Island, Finland, Færøyane). Ikkje BIND(EXISTS …):
      # med optimizer "None" gav det alltid «nei», så ingen vart merkte som norske.
      OPTIONAL { VALUES ?land { wd:Q20 wd:Q34 wd:Q35 wd:Q189 wd:Q33 wd:Q4628 } ?p wdt:P27 ?land . }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "nn,nb,no,en". }
    }`;
    // POST, fordi lista over datoar gjer adressa for lang for GET (skjemaformat = ingen CORS-førespurnad på førehand)
    const r = await fetch("https://query.wikidata.org/sparql", { method: "POST",
      headers: { Accept: "application/sparql-results+json", "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ query: q, format: "json" }) });
    if (!r.ok) throw new Error("Wikidata " + r.status);
    // Éi rad per land, så same person kan kome fleire gonger: slå saman
    const perP = new Map();
    for (const b of (await r.json()).results.bindings) {
      const id = b.p?.value;
      if (!id) continue;
      const skild = b.pDescription?.["xml:lang"] === "en" ? fråEngelsk(b.pDescription.value) : b.pDescription?.value || "";
      const x = perP.get(id) || { namn: b.pLabel?.value || "", skild, år: Number(b.aar?.value) || null,
                                  sl: Number(b.sl?.value) || 0, norsk: false, nordisk: false };
      if (b.land) { x.nordisk = true; if (/\/Q20$/.test(b.land.value)) x.norsk = true; }
      perP.set(id, x);
    }
    const alle = [...perP.values()]
      .filter(x => x.namn && !/^Q\d+$/.test(x.namn))
      .sort((a, b) => b.norsk - a.norsk || b.nordisk - a.nordisk || b.sl - a.sl);
    // Opptil 30 nordiske og 30 utanlandske (dei mest kjende, flest Wikipedia-artiklar).
    // Bibliofil blir spurd om éin og éin; boksen blir vist så snart den første er funnen.
    const kandidatar = [...alle.filter(x => x.nordisk).slice(0, 30), ...alle.filter(x => !x.nordisk).slice(0, 30)]
      .filter((x, i, l) => l.findIndex(y => y.namn === x.namn) === i);
    let liste = [], svar = 0;
    const namna = kandidatar.map(k => k.namn + (k.norsk ? " (norsk)" : k.nordisk ? " (nordisk)" : ""));
    const ix = await finnIndeks();
    // 6 forfattarar per søk; nordiske først, så boksen kjem fort med norske namn
    for (let i = 0; i < kandidatar.length; i += 6) {
      const bunk = kandidatar.slice(i, i + 6);
      try {
        const tal = await talBøker(bunk, ix); svar++;
        for (const k of bunk) if (tal.get(k.namn) > 0) liste.push({ ...k, bøker: tal.get(k.namn) });
        if (liste.length) { FØDD = { dato, liste, kandidatar: namna }; teiknFødd(); tilpass(); }
      } catch (e) { console.warn("Bibliofil:", e.message); }
    }
    // Svarte ikkje Bibliofil i det heile, viser vi dei tre første utan tal bøker
    if (!svar) liste = kandidatar.slice(0, 3).map(k => ({ ...k, bøker: null }));
    // «kandidatar» (alle frå Wikidata, med «(norsk)» o.l.) er lagra for feilsøking i konsollen
    FØDD = { dato, liste, kandidatar: namna };
    if (svar || !kandidatar.length) minne.skriv("fodd", FØDD);   // prøv Bibliofil på nytt neste gong om det feila
  } catch (e) { console.warn("Fekk ikkje henta Fødd i dag:", e.message); }
  teiknFødd(); tilpass();
}
const NYNORSK = [[/forfatter/g, "forfattar"], [/dikter/g, "diktar"], [/lyriker/g, "lyrikar"], [/dramatiker/g, "dramatikar"],
  [/oversetter/g, "omsetjar"], [/kritiker/g, "kritikar"], [/historiker/g, "historikar"], [/politiker/g, "politikar"],
  [/musiker/g, "musikar"], [/billedkunstner/g, "biletkunstnar"], [/kunstner/g, "kunstnar"], [/tegner/g, "teiknar"]];
// Engelske skildringar («Norwegian writer») når det ikkje finst norsk: dei vanlegaste orda
// blir omsette. Står det att engelske ord, blir skildringa droppa (berre «fødd …» blir vist).
const ENGELSK = { norwegian: "norsk", swedish: "svensk", danish: "dansk", finnish: "finsk", icelandic: "islandsk", faroese: "færøysk",
  sami: "samisk", russian: "russisk", hungarian: "ungarsk", german: "tysk", french: "fransk", english: "engelsk", british: "britisk",
  american: "amerikansk", irish: "irsk", scottish: "skotsk", italian: "italiensk", spanish: "spansk", polish: "polsk", dutch: "nederlandsk",
  writer: "forfattar", author: "forfattar", novelist: "romanforfattar", poet: "poet", playwright: "dramatikar", journalist: "journalist",
  historian: "historikar", translator: "omsetjar", essayist: "essayist", illustrator: "illustratør", "children's": "barnebok-",
  "comics": "teikneserie-", artist: "kunstnar", professor: "professor", and: "og", "short": "novelle-", story: "", screenwriter: "manusforfattar" };
function fråEngelsk(t) {
  const ord = String(t).replace(/\s*\(.*?\)/g, "").toLowerCase().split(/\s+/).filter(Boolean);
  if (!ord.length || ord.some(o => !(o.replace(/,$/, "") in ENGELSK))) return "";
  return ord.map(o => ENGELSK[o.replace(/,$/, "")] + (o.endsWith(",") ? "," : "")).filter(Boolean).join(" ").replace(/- /g, "");
}
const nynorskYrke = t => NYNORSK.reduce((x, [a, b]) => x.replace(a, b), t);
// Opptil FODD_MAKS forfattarar samstundes. Er det fleire, kjem dei neste fram neste gong
// sida blir vist. Blir det for trongt (tilpass), blir det færre før boksen fell bort.
const FODD_MAKS = 3;
let foddVis = FODD_MAKS;
function teiknFødd() {
  const liste = FODD && FØDD && FØDD.dato === isoDato(new Date()) ? FØDD.liste || [] : [];
  $("fodd").hidden = !liste.length;
  $("fodd").dataset.har = liste.length ? "1" : "";
  if (!liste.length) return;
  // Miks: opptil to nordiske og éin utanlandsk (færre om det ikkje finst nok av eitt slag).
  // Kvar gruppe rullar vidare for seg kvar gong sida blir vist.
  const n = Math.min(foddVis, liste.length);
  const nord = liste.filter(f => f.nordisk), ute = liste.filter(f => !f.nordisk);
  let talUte = ute.length ? Math.max(1, n - Math.min(nord.length, n - 1)) : 0;
  if (n === 1) talUte = nord.length ? 0 : 1;
  const talNord = Math.min(nord.length, n - talUte);
  talUte = Math.min(ute.length, n - talNord);
  const ta = (l, k) => Array.from({ length: k }, (_, i) => l[(foddNr * k + i) % l.length]);
  const valde = [...ta(nord, talNord), ...ta(ute, talUte)];
  $("foddListe").replaceChildren(...valde.map(f => {
    // Wikidata har ofte berre bokmålsskildring («russisk forfatter og dramatiker (1818–1883)»):
    // ta bort årstala i parentes og byt dei vanlegaste yrkesorda til nynorsk
    const skild = nynorskYrke(String(f.skild || "").replace(/\s*\([^)]*\d{3,4}[^)]*\)/g, "").trim());
    const rad = document.createElement("div"); rad.className = "person";
    const tekst = document.createElement("div");
    const namn = Object.assign(document.createElement("span"), { className: "pnamn", textContent: f.namn });
    const om = Object.assign(document.createElement("span"), { className: "skild",
      textContent: [skild.charAt(0).toUpperCase() + skild.slice(1), f.år > 0 && "fødd " + f.år].filter(Boolean).join(", ") });
    tekst.append(namn, om);
    rad.append(tekst);
    return rad;
  }));
}

// ---- Nedteljingshjulet og samspel med rotasjon.html -------------------------
const iRotasjon = window.parent !== window && !H.has("forhand");
// Nedteljing: linje som på plakatane (standard) eller hjul som på karusellane (#teljar=hjul).
// «sekund» er heile tida sida står, «ms» er det som er att (sida kan kome inn midt i).
const HJUL = H.get("teljar") === "hjul";
document.documentElement.classList.toggle("hjul-teljar", HJUL);
let teljAnim = null;
function teljNed(ms, gjenta, sekund) {
  if (teljAnim) teljAnim.cancel();
  if (!(ms > 0)) return;
  const frå = sekund > 0 ? Math.min(1, ms / (sekund * 1000)) : 1;
  teljAnim = HJUL
    ? $("hjul").animate([{ strokeDashoffset: (94.25 * (1 - frå)) + "px" }, { strokeDashoffset: "94.25px" }],
        { duration: ms, easing: "linear", fill: "forwards", iterations: gjenta ? Infinity : 1 })
    : $("nedteljing").animate([{ transform: `scaleX(${frå})` }, { transform: "scaleX(0)" }],
        { duration: ms, easing: "linear", fill: "forwards", iterations: gjenta ? Infinity : 1 });
}
function melde(b) { if (iRotasjon) parent.postMessage({ nyheiter: b }, "*"); }
let sistFerje = 0;
window.addEventListener("message", e => {
  if (!e.data || e.data.nyheiter !== "vis") return;
  teljNed(Number(e.data.att) || Number(e.data.sekund) * 1000 || 60000, false, Number(e.data.sekund));
  startVeksle(Number(e.data.sekund) || 0);
  foddNr++;   // neste forfattar kvar gong sida kjem fram
  teiknAlt();
  if (Date.now() - sistFerje > 60e3) { sistFerje = Date.now(); hentFerje(); }
});

// ---- Veksle (#veksle=1): éi rad om gongen ------------------------------------
// Radene som har noko å vise (ikkje skjulte) kjem etter tur. Står sida i rotasjonen,
// blir tida delt likt, så alt kjem fram éin gong medan sida står (minst 6 s per rad).
const VEKSLE = H.get("veksle") !== "0";   // standard: veksle; «veksle=0» viser alt på éin gong
document.documentElement.classList.toggle("veksle", VEKSLE);
let veksleNr = 0, veksleTid = null, veksleMs = 8000;
const synlegeRader = () => [...document.querySelectorAll(".rader .rad")].filter(r => !r.hidden);
function visRad() {
  const rader = synlegeRader();
  if (!rader.length) return;
  veksleNr %= rader.length;
  document.querySelectorAll(".rader .rad").forEach(r => r.classList.toggle("aktiv", r === rader[veksleNr]));
  $("punkt").replaceChildren(...(rader.length > 1 ? rader.map((r, i) => Object.assign(document.createElement("i"), { className: i === veksleNr ? "no" : "" })) : []));
}
function startVeksle(sekund) {
  if (!VEKSLE) return;
  clearInterval(veksleTid);
  veksleNr = 0;
  const n = Math.max(1, synlegeRader().length);
  veksleMs = sekund > 0 ? Math.max(6000, sekund * 1000 / n) : 8000;
  visRad();
  veksleTid = setInterval(() => { veksleNr++; visRad(); }, veksleMs);
}

// ---- Får alt plass? ------------------------------------------------------------
// Er det for mykje på sida (farevarsel, skuletime, ferje og Fødd i dag samstundes),
// blir ho tettare i to steg. Er det god plass, får datoen litt ekstra luft under seg. Får det framleis ikkje plass, blir det færre namn i Fødd i dag, og til slutt fell boksen bort.
function tilpass() {
  // Veksling: står ingen synleg rad fremst (data kom etter start, eller rada forsvann), vis ei no
  if (VEKSLE && !document.querySelector(".rader .rad.aktiv:not([hidden])")) visRad();
  // Vent til sida (og skrifta/temaet) er ferdig lasta, elles må nettlesaren rekne ut
  // utforminga for tidleg (Firefox: «Layouten ble tvunget før siden var fullastet»)
  if (document.readyState !== "complete") return;
  const rot = document.documentElement, side = document.querySelector(".side");
  const for_ = () => side.scrollHeight > side.clientHeight + 2;
  rot.classList.remove("tett", "tettare");
  rot.classList.add("luft");
  if (foddVis !== FODD_MAKS) { foddVis = FODD_MAKS; teiknFødd(); }
  $("fodd").hidden = !$("fodd").dataset.har;
  if (!for_()) return;
  rot.classList.remove("luft");   // ikkje plass til ekstra luft
  if (!for_()) return;
  rot.classList.add("tett");
  if (!for_()) return;
  rot.classList.add("tettare");
  // Færre forfattarar, og til slutt ingen
  while (for_() && !$("fodd").hidden && foddVis > 1) { foddVis--; teiknFødd(); }
  if (for_() && !$("fodd").hidden) $("fodd").hidden = true;
}

// ---- I gang -------------------------------------------------------------------
function teiknAlt() { teiknKlokke(); teiknSkule(); teiknOpning(); teiknVer(); teiknFerje(); teiknDag(); teiknFødd(); tilpass(); if (VEKSLE) visRad(); }
teiknAlt();
// Klokka blir oppdatert rett etter kvart heile sekund
(function tikk() { teiknKlokke(); teiknSkule(); tilpass(); setTimeout(tikk, 1000 - (Date.now() % 1000) + 20); })();
setInterval(() => { teiknOpning(); teiknVer(); teiknFerje(); teiknDag(); teiknFødd(); tilpass(); }, 15e3);
hentVer(); setInterval(hentVer, VER_KVAR_MS);
window.addEventListener("load", tilpass);
hentFødd(); setInterval(hentFødd, 30 * 60e3);   // hentar berre når datoen er ny
hentDag(); setInterval(hentDag, 30 * 60e3);     // same her
hentFerje(); sistFerje = Date.now(); setInterval(() => { sistFerje = Date.now(); hentFerje(); }, FERJE_KVAR_MS);
if (!iRotasjon) teljNed(20000, true, 20);
if (VEKSLE) startVeksle(0);
melde("har"); melde("klar");
</script>
